name: SISMONAUTA - Responder comentarios

on:
  schedule:
    - cron: '2-57/5 * * * *'
  repository_dispatch:
    types: [sismonauta-minute]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar respuestas reales (desmarcar para vista previa)'
        type: boolean
        default: true
      approved_comment_ids:
        description: "IDs verificados como ajenos a la página, separados por comas"
        type: string
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: sismonauta-comentarios
  cancel-in-progress: false

jobs:
  responder:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID || vars.FACEBOOK_PAGE_ID }}
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_COMMENT_MODEL: ${{ vars.GEMINI_COMMENT_MODEL }}
      GROQ_COMMENT_MODEL: ${{ vars.GROQ_COMMENT_MODEL }}
      OPENROUTER_COMMENT_MODEL: ${{ vars.OPENROUTER_COMMENT_MODEL }}
      FB_GRAPH_VERSION: 'v25.0'
      ALLOW_ANONYMOUS_TOPLEVEL: '1'
      # Permite anidados sin autor si Meta informa can_comment=true.
      ALLOW_ANONYMOUS_NESTED: '1'
      APPROVED_COMMENT_IDS: ${{ inputs.approved_comment_ids || '' }}
      MAX_RUNTIME_SECONDS: '1200'
      INVENTORY_REFRESH_SECONDS: '3600'
      MAX_COMMENT_REPLIES: '100'
      MAX_AI_REPLIES_PER_RUN: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencia
        run: python -m pip install requests
      - name: Pruebas offline
        run: python comentarios_sismonauta.py --test
      - name: Responder comentarios
        env:
          PUBLISH: ${{ github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.publish }}
        shell: bash
        run: |
          args=(--out output_comentarios)
          if [[ "$PUBLISH" == 'true' ]]; then args+=(--publish); fi
          echo "Modo publicación: $PUBLISH"
          test -f comentarios_sismonauta.py
          python comentarios_sismonauta.py "${args[@]}"
      - name: Guardar auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-auditoria-${{ github.run_id }}
          path: output_comentarios/resumen.json
          if-no-files-found: warn
          retention-days: 7
