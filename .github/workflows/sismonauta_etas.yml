
name: SISMONAUTA - ETAS Chile (cron-job.org)

# ==================================================
# EJECUCION EXTERNA POR CRON-JOB.ORG
# ==================================================
#
# Pais fijo: Chile
#
# publish=false:
#   Generar video sin publicar.
#
# publish=true:
#   Generar video y publicar en Instagram
#   @sismonauta y Fanpage Sismonauta.
#
# No depende del schedule interno de GitHub.
#
# El modelo ETAS es experimental.
# No constituye una alerta sismica oficial.
# ==================================================

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sismonauta-etas-chile
  cancel-in-progress: false

jobs:
  generar_y_publicar:

    name: Generar ETAS Chile y publicar video

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:

      # ==========================================
      # RENDIMIENTO
      # ==========================================

      PYTHONUNBUFFERED: '1'
      MPLBACKEND: 'Agg'
      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'

      # ==========================================
      # GITHUB
      # ==========================================

      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # ==========================================
      # INSTAGRAM
      # ==========================================

      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # ==========================================
      # FACEBOOK
      # ==========================================

      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # ==========================================
      # META GRAPH API
      # ==========================================

      IG_GRAPH_BASE: 'https://graph.instagram.com'
      META_GRAPH_VERSION: 'v25.0'
      IG_UPLOAD_MODE: 'url'

      # ==========================================
      # ETAS
      # ==========================================

      ETAS_TIMEOUT_SECONDS: '16500'

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ==========================================
      # 2. CONFIGURAR PYTHON
      # ==========================================

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================
      # 3. PREPARAR DIRECTORIOS Y HERRAMIENTAS
      # ==========================================

      - name: Verificar FFmpeg fuentes y directorios
        timeout-minutes: 3
        run: |
          set -euo pipefail

          echo "==================================="
          echo "SISMONAUTA ETAS CHILE"
          echo "PREPARACION DEL ENTORNO"
          echo "==================================="

          # Directorio con permisos del runner.
          mkdir -p output_etas

          echo "Directorio de trabajo:"
          pwd

          echo "Directorio de salida:"
          realpath output_etas

          # Verificar escritura.
          touch output_etas/prueba_escritura.tmp
          rm output_etas/prueba_escritura.tmp

          echo "Permisos de escritura verificados"

          # --------------------------------------
          # FFMPEG
          # --------------------------------------

          if command -v ffmpeg >/dev/null 2>&1; then
            echo "FFmpeg disponible:"
            ffmpeg -version | sed -n '1p'
          else
            echo "::error::FFmpeg no disponible."
            exit 1
          fi

          # --------------------------------------
          # FFPROBE
          # --------------------------------------

          if command -v ffprobe >/dev/null 2>&1; then
            echo "FFprobe disponible:"
            ffprobe -version | sed -n '1p'
          else
            echo "::error::FFprobe no disponible."
            exit 1
          fi

          # --------------------------------------
          # FUENTES DEJAVU
          # --------------------------------------

          if [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]] &&
             [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]]; then

            echo "Fuentes DejaVu verificadas"

          else

            echo "::warning::Fuentes DejaVu no encontradas"
            if command -v fc-list >/dev/null 2>&1; then
              fc-list | sed -n '1,5p' || true
            fi

          fi

          echo "==================================="
          echo "ENTORNO PREPARADO"
          echo "==================================="

      # ==========================================
      # 4. INSTALAR DEPENDENCIAS CIENTIFICAS
      # ==========================================

      - name: Instalar dependencias ETAS
        timeout-minutes: 20
        run: |
          set -euo pipefail

          echo "Instalando bibliotecas del modelo ETAS"

          python -m pip install \
            --disable-pip-version-check \
            --prefer-binary \
            --retries 3 \
            --timeout 45 \
            'numpy>=1.26,<3' \
            'pandas>=2.1,<3' \
            'scipy>=1.11,<2' \
            'matplotlib>=3.8,<4' \
            'requests>=2.31,<3' \
            'cartopy>=0.22,<1' \
            'numba>=0.59,<1' \
            'Pillow>=10,<13' \
            'edge-tts>=6,<8' \
            'gTTS>=2.5,<3' \
            'pycountry>=23,<30' \
            'geopy>=2,<3' \
            'shapely>=2,<3'

          echo "Dependencias instaladas"

      # ==========================================
      # 5. VERIFICAR LIBRERIAS
      # ==========================================

      - name: Verificar modulos cientificos
        timeout-minutes: 3
        run: |
          set -euo pipefail

          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import matplotlib
          import requests
          import cartopy
          import numba
          import PIL
          import edge_tts
          import gtts
          import pycountry
          import geopy
          import shapely

          print("===================================")
          print("BIBLIOTECAS CIENTIFICAS DISPONIBLES")
          print("===================================")
          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("SciPy:", scipy.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Cartopy:", cartopy.__version__)
          print("Numba:", numba.__version__)
          print("Shapely:", shapely.__version__)
          print("===================================")
          PY

      # ==========================================
      # 6. VALIDAR ARCHIVOS PYTHON
      # ==========================================

      - name: Validar archivos Python
        run: |
          set -euo pipefail

          if [[ ! -f sismonauta_etas_publicar.py ]]; then
            echo "::error::No existe sismonauta_etas_publicar.py"
            exit 1
          fi

          if [[ ! -f etas_multipaís_24h_animado.py ]]; then
            echo "::error::No existe etas_multipaís_24h_animado.py"
            exit 1
          fi

          python -m py_compile \
            sismonauta_etas_publicar.py \
            etas_multipaís_24h_animado.py

          echo "Archivos Python verificados"

      # ==========================================
      # 7. VALIDAR RUTA DE SALIDA DEL PUBLICADOR
      # ==========================================

      - name: Verificar compatibilidad de rutas
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          output = Path("output_etas").resolve()
          output.mkdir(parents=True, exist_ok=True)

          print("Directorio válido:", output)

          file = output / "test_output.tmp"
          file.write_text("OK", encoding="utf-8")
          assert file.read_text(encoding="utf-8") == "OK"
          file.unlink()

          print("Permisos de escritura correctos")
          print("Salida esperada:")
          print(output / "ETAS_DOBLE_HEATMAP_CON_LIKE.mp4")
          PY

      # ==========================================
      # 8. DETERMINAR MODO DE EJECUCION
      # ==========================================

      - name: Determinar modo de publicacion
        id: modo

        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}

        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Evento no permitido"
            exit 1
          fi

          if [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "==================================="
          echo "SISMONAUTA - ETAS CHILE"
          echo "==================================="
          echo "Pais: Chile"
          echo "Origen: workflow_dispatch"
          echo "Publicar: $PUBLISH"
          echo "Instagram: @sismonauta"
          echo "Facebook: Sismonauta"
          echo "==================================="

          echo "Fecha UTC:"
          date -u

          echo "Hora de Chile:"
          TZ=America/Santiago date

      # ==========================================
      # 9. COMPROBAR SECRETOS
      # ==========================================

      - name: Comprobar credenciales Meta
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}

        run: |
          set -euo pipefail

          if [[ "$PUBLISH" == "true" ]]; then

            for name in \
              INSTAGRAM_TOKEN \
              INSTAGRAM_USER_ID \
              FACEBOOK_PAGE_ID \
              FACEBOOK_PAGE_TOKEN
            do

              if [[ -z "${!name:-}" ]]; then
                echo "::error::Falta secreto $name"
                exit 1
              fi

            done

            echo "Credenciales de Meta presentes"

          else
            echo "Vista previa sin publicar"
          fi

      # ==========================================
      # 10. EJECUTAR MODELO ETAS CHILE
      # ==========================================

      - name: Generar mapas video y publicar
        id: ejecutar
        timeout-minutes: 335

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}

        run: |
          set -uo pipefail

          args=(
            --out output_etas
            --original 'etas_multipaís_24h_animado.py'
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "==================================="
          echo "ETAS CHILE - GENERACION"
          echo "==================================="
          echo "Pais fijo: Chile"
          echo "25 instantaneas horarias"
          echo "Dos mapas de calor"
          echo "Narracion y musica"
          echo "Video Facebook: 1080x1350"
          echo "Reel Instagram: 1080x1920"
          echo "Publicar: $PUBLISH"
          echo "==================================="

          python sismonauta_etas_publicar.py "${args[@]}"
          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "Codigo de salida: $CODE"

          # La verificacion posterior evalua el error.
          exit 0

      # ==========================================
      # 11. VERIFICAR RESULTADOS
      # ==========================================

      - name: Verificar generacion y publicacion
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          EXIT_CODE: ${{ steps.ejecutar.outputs.exit_code }}

        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          output = Path("output_etas")

          receipt = output / "estado_publicacion.json"

          if not receipt.exists():
              raise SystemExit(
                  "::error::No existe recibo de publicacion"
              )

          try:
              data = json.loads(
                  receipt.read_text(encoding="utf-8")
              )
          except Exception as exc:
              raise SystemExit(
                  "::error::Recibo invalido: " + str(exc)
              )

          country = data.get("country")
          status = data.get("status")

          code = int(os.getenv("EXIT_CODE") or "1")

          print("===================================")
          print("RESULTADOS SISMONAUTA ETAS")
          print("===================================")
          print("Pais:", country)
          print("Estado:", status)
          print("Codigo Python:", code)

          if country != "Chile":
              raise SystemExit(
                  "::error::Pais incorrecto"
              )

          if code != 0:
              raise SystemExit(
                  "::error::Fallo generacion o publicacion"
              )

          # Comprobar videos locales.
          original = (
              output / "ETAS_DOBLE_HEATMAP_CON_LIKE.mp4"
          )

          reel = (
              output / "sismonauta_etas_reel_9x16.mp4"
          )

          if not original.is_file():
              raise SystemExit(
                  "::error::No existe video ETAS original"
              )

          if not reel.is_file():
              raise SystemExit(
                  "::error::No existe Reel vertical"
              )

          if original.stat().st_size < 10000:
              raise SystemExit(
                  "::error::Video ETAS original incompleto"
              )

          if reel.stat().st_size < 10000:
              raise SystemExit(
                  "::error::Reel vertical incompleto"
              )

          print("Video ETAS original:", original)
          print("Reel vertical:", reel)

          publish = (
              os.getenv("PUBLISH") == "true"
          )

          if publish:

              if status != "published":
                  raise SystemExit(
                      "::error::Publicacion no confirmada"
                  )

              targets = data.get("targets", {})

              for platform in ("instagram", "facebook"):

                  item = targets.get(platform, {})

                  if (
                      item.get("status") != "published"
                      or not item.get("id")
                  ):
                      raise SystemExit(
                          "::error::Falta confirmacion de "
                          + platform
                      )

                  print(
                      platform.upper(),
                      "ENVIO CONFIRMADO:",
                      item["id"]
                  )

          else:

              if status != "preview_only":
                  raise SystemExit(
                      "::error::Vista previa no confirmada"
                  )

              print("MODO VISTA PREVIA: SIN PUBLICAR")

          print("===================================")
          print("VERIFICACION COMPLETADA")
          print("===================================")
          PYVERIFY

      # ==========================================
      # 12. RESUMEN DE GITHUB ACTIONS
      # ==========================================

      - name: Resumen de ejecucion
        if: always()

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          EXIT_CODE: ${{ steps.ejecutar.outputs.exit_code }}

        run: |
          {
            echo "## SISMONAUTA ETAS CHILE"
            echo ""
            echo "- Pais: Chile"
            echo "- Activacion: $GITHUB_EVENT_NAME"
            echo "- Publicar: ${PUBLISH:-desconocido}"
            echo "- Codigo Python: ${EXIT_CODE:-no ejecutado}"
            echo "- Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Hora Chile: $(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f output_etas/estado_publicacion.json ]]; then
            {
              echo "### Estado de publicacion"
              echo ""
              echo '```json'
              python -m json.tool \
                output_etas/estado_publicacion.json \
                2>/dev/null || echo "Recibo no legible"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ==========================================
      # 13. GUARDAR VIDEOS Y EVIDENCIAS
      # ==========================================

      - name: Guardar videos y registros
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: sismonauta-etas-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            output_etas/estado_publicacion.json
            output_etas/ETAS_DOBLE_HEATMAP_CON_LIKE.mp4
            output_etas/sismonauta_etas_reel_9x16.mp4

          if-no-files-found: warn
          retention-days: 7
