
name: SISMONAUTA - ETAS Chile (cron-job.org)

# ==========================================================
# SISMONAUTA ETAS CHILE
#
# Activacion:
# cron-job.org -> GitHub API -> workflow_dispatch
#
# publish=false: generar video sin publicar
# publish=true: generar y publicar Instagram/Facebook
#
# Pais fijo: Chile
# Sin apt-get, sin sudo, sin /mnt/data
#
# IMPORTANTE:
# Modelo ETAS experimental, no constituye
# prediccion oficial ni alerta sismica.
# ==========================================================

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar en Instagram y Facebook"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sismonauta-etas-chile
  cancel-in-progress: false

jobs:
  generar_y_publicar:

    name: ETAS Chile - Generacion y publicacion

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    env:
      # ------------------------------------------
      # Rendimiento
      # ------------------------------------------
      PYTHONUNBUFFERED: "1"
      MPLBACKEND: "Agg"
      OPENBLAS_NUM_THREADS: "2"
      OMP_NUM_THREADS: "2"
      NUMBA_NUM_THREADS: "2"

      # ------------------------------------------
      # Identidad del repositorio
      # ------------------------------------------
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # ------------------------------------------
      # Instagram
      # ------------------------------------------
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # ------------------------------------------
      # Facebook
      # ------------------------------------------
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # ------------------------------------------
      # Meta API
      # ------------------------------------------
      IG_GRAPH_BASE: "https://graph.instagram.com"
      META_GRAPH_VERSION: "v25.0"
      IG_UPLOAD_MODE: "url"

      # ------------------------------------------
      # ETAS: salida en directorio escribible
      # ------------------------------------------
      ETAS_OUTPUT_DIR: "output_etas"
      ETAS_COUNTRY: "Chile"
      ETAS_TIMEOUT_SECONDS: "16500"

    steps:

      # ====================================================
      # 1. CHECKOUT
      # ====================================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ====================================================
      # 2. PYTHON
      # ====================================================

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ====================================================
      # 3. PREPARAR DIRECTORIO
      # ====================================================

      - name: Preparar directorio ETAS
        timeout-minutes: 2
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output_etas"

          echo "==================================="
          echo "SISMONAUTA ETAS CHILE"
          echo "==================================="
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Espacio de trabajo: $GITHUB_WORKSPACE"
          echo "Salida: $GITHUB_WORKSPACE/output_etas"
          echo "==================================="

          touch "$GITHUB_WORKSPACE/output_etas/test.tmp"
          rm "$GITHUB_WORKSPACE/output_etas/test.tmp"

          echo "Directorio con permisos de escritura: OK"

      # ====================================================
      # 4. INSTALAR FFMPEG + FFPROBE SIN APT-GET
      # ====================================================

      - name: Instalar FFmpeg y FFprobe sin sudo
        timeout-minutes: 12
        run: |
          set -euo pipefail

          echo "==================================="
          echo "INSTALACION FFMPEG / FFPROBE"
          echo "==================================="

          BIN_DIR="$RUNNER_TEMP/etas_ffmpeg_bin"
          EXTRACT_DIR="$RUNNER_TEMP/etas_ffmpeg_extract"
          ARCHIVE="$RUNNER_TEMP/etas_ffmpeg.tar.xz"

          mkdir -p "$BIN_DIR" "$EXTRACT_DIR"

          if command -v ffmpeg >/dev/null 2>&1 &&
             command -v ffprobe >/dev/null 2>&1; then

            echo "FFmpeg y FFprobe ya disponibles."

          else

            echo "Descargando paquete Linux x86-64..."

            DOWNLOAD_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"

            curl \
              --fail \
              --location \
              --show-error \
              --silent \
              --retry 3 \
              --retry-delay 5 \
              --connect-timeout 20 \
              --max-time 420 \
              "$DOWNLOAD_URL" \
              --output "$ARCHIVE"

            echo "Descarga completada."
            echo "Tamano:"
            du -h "$ARCHIVE"

            echo "Extrayendo herramientas..."

            tar -xJf "$ARCHIVE" -C "$EXTRACT_DIR"

            FFMPEG_SOURCE="$(
              find "$EXTRACT_DIR" \
                -type f \
                -name ffmpeg \
                -print -quit
            )"

            FFPROBE_SOURCE="$(
              find "$EXTRACT_DIR" \
                -type f \
                -name ffprobe \
                -print -quit
            )"

            if [[ -z "$FFMPEG_SOURCE" ]]; then
              echo "::error::No se encontro ffmpeg en el paquete."
              exit 1
            fi

            if [[ -z "$FFPROBE_SOURCE" ]]; then
              echo "::error::No se encontro ffprobe en el paquete."
              exit 1
            fi

            install -m 755 \
              "$FFMPEG_SOURCE" \
              "$BIN_DIR/ffmpeg"

            install -m 755 \
              "$FFPROBE_SOURCE" \
              "$BIN_DIR/ffprobe"

            # Exportar para pasos posteriores.
            echo "$BIN_DIR" >> "$GITHUB_PATH"

            # Exportar para este mismo paso.
            export PATH="$BIN_DIR:$PATH"

          fi

          echo "==================================="
          echo "VERIFICANDO BINARIOS"
          echo "==================================="

          command -v ffmpeg
          command -v ffprobe

          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'

          echo "Comprobando libx264:"
          ffmpeg -hide_banner -encoders | grep -F libx264

          echo "Comprobando AAC:"
          ffmpeg -hide_banner -encoders | grep -E '^[[:space:]]*A.* aac '

          echo "FFmpeg y FFprobe operativos."

      # ====================================================
      # 5. VERIFICAR FUENTES
      # ====================================================

      - name: Verificar fuentes disponibles
        timeout-minutes: 2
        run: |
          set -euo pipefail

          echo "==================================="
          echo "FUENTES PARA MAPAS ETAS"
          echo "==================================="

          if [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]]; then
            echo "DejaVuSans regular: OK"
          else
            echo "::warning::DejaVuSans regular no encontrada."
          fi

          if [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]]; then
            echo "DejaVuSans Bold: OK"
          else
            echo "::warning::DejaVuSans Bold no encontrada."
          fi

          if command -v fc-list >/dev/null 2>&1; then
            echo "Primeras fuentes disponibles:"
            fc-list | sed -n '1,8p' || true
          fi

      # ====================================================
      # 6. INSTALAR DEPENDENCIAS
      # ====================================================

      - name: Instalar librerias ETAS
        timeout-minutes: 25
        run: |
          set -euo pipefail

          echo "==================================="
          echo "DEPENDENCIAS CIENTIFICAS"
          echo "==================================="

          python -m pip install \
            --disable-pip-version-check \
            --prefer-binary \
            --only-binary=:all: \
            --retries 3 \
            --timeout 45 \
            'numpy>=1.26,<3' \
            'pandas>=2.1,<3' \
            'scipy>=1.11,<2' \
            'matplotlib>=3.8,<4' \
            'requests>=2.31,<3' \
            'cartopy>=0.22,<1' \
            'numba>=0.59,<1' \
            'Pillow>=10,<13' \
            'edge-tts>=6,<8' \
            'gTTS>=2.5,<3' \
            'pycountry>=23,<30' \
            'geopy>=2,<3' \
            'shapely>=2,<3' \
            'ipython>=8,<10'

          echo "Dependencias instaladas."

      # ====================================================
      # 7. COMPROBAR LIBRERIAS
      # ====================================================

      - name: Verificar modulos cientificos
        timeout-minutes: 4
        run: |
          set -euo pipefail

          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import matplotlib
          import requests
          import cartopy
          import numba
          import PIL
          import edge_tts
          import gtts
          import pycountry
          import geopy
          import shapely
          import IPython

          print("===================================")
          print("BIBLIOTECAS VERIFICADAS")
          print("===================================")
          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("SciPy:", scipy.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Cartopy:", cartopy.__version__)
          print("Numba:", numba.__version__)
          print("Shapely:", shapely.__version__)
          print("IPython:", IPython.__version__)
          print("===================================")
          PY

      # ====================================================
      # 8. COMPROBAR ARCHIVOS PYTHON
      # ====================================================

      - name: Validar archivos ETAS
        timeout-minutes: 2
        run: |
          set -euo pipefail

          test -f "sismonauta_etas_publicar.py" || {
            echo "::error::Falta sismonauta_etas_publicar.py"
            exit 1
          }

          test -f "etas_multipaís_24h_animado.py" || {
            echo "::error::Falta etas_multipaís_24h_animado.py"
            exit 1
          }

          python -m py_compile \
            "sismonauta_etas_publicar.py" \
            "etas_multipaís_24h_animado.py"

          echo "Sintaxis Python: OK"

      # ====================================================
      # 9. VALIDAR QUE EL PUBLICADOR NO USE /mnt/data
      # ====================================================

      - name: Verificar rutas del publicador
        timeout-minutes: 2
        run: |
          set -euo pipefail

          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path("sismonauta_etas_publicar.py")
          source = path.read_text(encoding="utf-8")

          ast.parse(source, filename=str(path))

          if "/mnt/data" in source:
              raise SystemExit(
                  "::error::El publicador todavia contiene "
                  "/mnt/data. Actualiza run_original() "
                  "antes de ejecutar ETAS."
              )

          output = Path("output_etas")
          output.mkdir(parents=True, exist_ok=True)

          test = output / "test_output.tmp"
          test.write_text("OK", encoding="utf-8")

          assert test.read_text(encoding="utf-8") == "OK"

          test.unlink()

          print("Publicador sin /mnt/data: OK")
          print("Directorio output_etas: OK")
          PY

      # ====================================================
      # 10. MODO DE PUBLICACION
      # ====================================================

      - name: Determinar modo de ejecucion
        id: modo

        env:
          REQUESTED_PUBLISH: ${{ inputs.publish }}

        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Evento no autorizado."
            exit 1
          fi

          if [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "==================================="
          echo "SISMONAUTA ETAS CHILE"
          echo "==================================="
          echo "Pais: Chile"
          echo "Publicar: $PUBLISH"
          echo "Instagram: @sismonauta"
          echo "Facebook: Sismonauta"
          echo "Hora Chile:"
          TZ=America/Santiago date
          echo "==================================="

      # ====================================================
      # 11. VALIDAR CREDENCIALES
      # ====================================================

      - name: Verificar secretos Meta
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}

        run: |
          set -euo pipefail

          if [[ "$PUBLISH" == "true" ]]; then

            for name in \
              INSTAGRAM_TOKEN \
              INSTAGRAM_USER_ID \
              FACEBOOK_PAGE_ID \
              FACEBOOK_PAGE_TOKEN
            do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Falta secreto: $name"
                exit 1
              fi
            done

            echo "Credenciales Meta presentes."
          else
            echo "Modo prueba: no se publicara en Meta."
          fi

      # ====================================================
      # 12. GENERAR ETAS Y PUBLICAR
      # ====================================================

      - name: Ejecutar modelo ETAS Chile
        id: ejecutar
        timeout-minutes: 310

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}

        run: |
          set -uo pipefail

          args=(
            --out output_etas
            --original 'etas_multipaís_24h_animado.py'
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "==================================="
          echo "INICIANDO ETAS CHILE"
          echo "==================================="
          echo "Pais: Chile"
          echo "25 mapas horarios"
          echo "Dos mapas de calor"
          echo "Narracion y musica"
          echo "Video Instagram 9:16"
          echo "Video Facebook 4:5"
          echo "Publicar: $PUBLISH"
          echo "==================================="

          python -u sismonauta_etas_publicar.py "${args[@]}"

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "Codigo de salida Python: $CODE"

          # El siguiente paso verifica el resultado.
          exit 0

      # ====================================================
      # 13. VERIFICAR RESULTADO
      # ====================================================

      - name: Comprobar videos y publicacion
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          EXIT_CODE: ${{ steps.ejecutar.outputs.exit_code }}

        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          out = Path("output_etas")
          receipt = out / "estado_publicacion.json"

          if not receipt.is_file():
              raise SystemExit(
                  "::error::No existe el recibo ETAS"
              )

          data = json.loads(
              receipt.read_text(encoding="utf-8")
          )

          country = data.get("country")
          status = data.get("status")
          code = int(os.environ.get("EXIT_CODE") or "1")

          print("===================================")
          print("RESULTADOS SISMONAUTA ETAS CHILE")
          print("===================================")
          print("Pais:", country)
          print("Estado:", status)
          print("Codigo Python:", code)

          if country != "Chile":
              raise SystemExit("::error::Pais incorrecto")

          if code != 0:
              raise SystemExit(
                  "::error::El publicador ETAS fallo"
              )

          original = out / "ETAS_DOBLE_HEATMAP_CON_LIKE.mp4"
          reel = out / "sismonauta_etas_reel_9x16.mp4"

          for video in (original, reel):
              if not video.is_file():
                  raise SystemExit(
                      "::error::Falta video: " + str(video)
                  )

              if video.stat().st_size < 10000:
                  raise SystemExit(
                      "::error::Video incompleto: "
                      + str(video)
                  )

              print(
                  "Video verificado:",
                  video,
                  "Bytes:",
                  video.stat().st_size
              )

          if os.getenv("PUBLISH") == "true":

              if status != "published":
                  raise SystemExit(
                      "::error::Publicacion no confirmada"
                  )

              for platform in ("instagram", "facebook"):

                  item = (
                      data.get("targets", {})
                      .get(platform, {})
                  )

                  if (
                      item.get("status") != "published"
                      or not item.get("id")
                  ):
                      raise SystemExit(
                          "::error::Destino no confirmado: "
                          + platform
                      )

                  print(
                      platform.upper(),
                      "ID:",
                      item["id"]
                  )

          else:

              if status != "preview_only":
                  raise SystemExit(
                      "::error::Vista previa no confirmada"
                  )

              print("VISTA PREVIA: SIN PUBLICAR")

          print("VERIFICACION COMPLETADA")
          PYVERIFY

      # ====================================================
      # 14. RESUMEN GITHUB ACTIONS
      # ====================================================

      - name: Resumen de la ejecucion
        if: always()

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          EXIT_CODE: ${{ steps.ejecutar.outputs.exit_code }}

        run: |
          {
            echo "## SISMONAUTA - ETAS Chile"
            echo ""
            echo "- Pais: Chile"
            echo "- Activacion: $GITHUB_EVENT_NAME"
            echo "- Publicacion: ${PUBLISH:-desconocida}"
            echo "- Codigo Python: ${EXIT_CODE:-no ejecutado}"
            echo "- UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Chile: $(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f output_etas/estado_publicacion.json ]]; then
            {
              echo "### Estado del proceso"
              echo ""
              echo '```json'

              python -m json.tool \
                output_etas/estado_publicacion.json \
                || echo "Recibo no legible"

              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # ====================================================
      # 15. GUARDAR EVIDENCIAS
      # ====================================================

      - name: Guardar videos y registros
        if: always()
        uses: actions/upload-artifact@v4

        with:
          name: sismonauta-etas-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            output_etas/estado_publicacion.json
            output_etas/ETAS_DOBLE_HEATMAP_CON_LIKE.mp4
            output_etas/sismonauta_etas_reel_9x16.mp4

          if-no-files-found: warn
          retention-days: 7
