
name: SISMONAUTA - ETAS Chile (cron-job.org)

# ==================================================
# SISMONAUTA - MODELO ETAS CHILE
# ==================================================
#
# Activacion automatica externa:
# cron-job.org -> GitHub API -> workflow_dispatch
#
# Pais: Chile exclusivamente
#
# publish=false:
#   Genera mapas y videos sin publicar.
#
# publish=true:
#   Genera videos e intenta publicar en:
#   - Instagram @sismonauta
#   - Fanpage Facebook Sismonauta
#
# No usa el schedule interno de GitHub.
#
# MEJORA:
# Se elimina la instalacion apt-get de FFmpeg
# y se utilizan las herramientas del runner.
# ==================================================

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar video en Instagram y Facebook'
        required: true
        type: boolean
        default: false

# ==================================================
# PERMISOS
# ==================================================

permissions:
  contents: write

# ==================================================
# CONTROL DE CONCURRENCIA
# ==================================================

concurrency:
  group: sismonauta-etas-chile
  cancel-in-progress: false

# ==================================================
# TRABAJO PRINCIPAL
# ==================================================

jobs:
  generar_y_publicar:

    name: Calcular ETAS Chile y publicar video

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    env:

      # ==========================================
      # CONFIGURACION PYTHON Y RENDIMIENTO
      # ==========================================

      PYTHONUNBUFFERED: '1'
      MPLBACKEND: 'Agg'

      OPENBLAS_NUM_THREADS: '2'
      OMP_NUM_THREADS: '2'
      NUMBA_NUM_THREADS: '2'

      # ==========================================
      # GITHUB
      # ==========================================

      GH_TOKEN: ${{ github.token }}

      GITHUB_REPOSITORY: ${{ github.repository }}

      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # ==========================================
      # INSTAGRAM
      # ==========================================

      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}

      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # ==========================================
      # FACEBOOK
      # ==========================================

      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}

      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # ==========================================
      # META GRAPH API
      # ==========================================

      IG_GRAPH_BASE: 'https://graph.instagram.com'

      META_GRAPH_VERSION: 'v25.0'

      IG_UPLOAD_MODE: 'url'

      # ==========================================
      # TIEMPO MAXIMO DEL MODELO ETAS
      # ==========================================

      ETAS_TIMEOUT_SECONDS: '16500'

    steps:

      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ==========================================
      # 2. CONFIGURAR PYTHON
      # ==========================================

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================
      # 3. VERIFICAR FFMPEG Y FUENTES
      # ==========================================

      - name: Verificar FFmpeg y fuentes
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          echo "==================================="
          echo "SISMONAUTA - ETAS CHILE"
          echo "VERIFICACION DE HERRAMIENTAS"
          echo "==================================="

          # Directorios para video y evidencias
          mkdir -p /mnt/data
          mkdir -p output_etas

          # --------------------------------------
          # FFMPEG
          # --------------------------------------

          if command -v ffmpeg >/dev/null 2>&1; then

            echo "FFmpeg disponible:"
            ffmpeg -version | head -n 1

          else

            echo "::error::FFmpeg no esta disponible en el runner."
            exit 1

          fi

          # --------------------------------------
          # FFPROBE
          # --------------------------------------

          if command -v ffprobe >/dev/null 2>&1; then

            echo "FFprobe disponible:"
            ffprobe -version | head -n 1

          else

            echo "::error::FFprobe no esta disponible."
            exit 1

          fi

          # --------------------------------------
          # FUENTES DEJAVU
          # --------------------------------------

          if [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf ]] &&
             [[ -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]]; then

            echo "Fuentes DejaVu verificadas"

          else

            echo "::warning::Fuentes DejaVu no encontradas."
            echo "Se utilizara una fuente alternativa si existe."

          fi

          echo "==================================="
          echo "HERRAMIENTAS VERIFICADAS"
          echo "==================================="

      # ==========================================
      # 4. INSTALAR DEPENDENCIAS CIENTIFICAS
      # ==========================================

      - name: Instalar dependencias cientificas
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail

          echo "==================================="
          echo "INSTALACION DE LIBRERIAS ETAS"
          echo "==================================="

          python -m pip install \
            --disable-pip-version-check \
            --prefer-binary \
            --retries 3 \
            --timeout 45 \
            'numpy>=1.26,<3' \
            'pandas>=2.1,<3' \
            'scipy>=1.11,<2' \
            'matplotlib>=3.8,<4' \
            'requests>=2.31,<3' \
            'cartopy>=0.22,<1' \
            'numba>=0.59,<1' \
            'Pillow>=10,<13' \
            'edge-tts>=6,<8' \
            'gTTS>=2.5,<3' \
            'pycountry>=23,<30' \
            'geopy>=2,<3' \
            'shapely>=2,<3'

          echo "==================================="
          echo "DEPENDENCIAS INSTALADAS"
          echo "==================================="

      # ==========================================
      # 5. COMPROBAR MODULOS PYTHON
      # ==========================================

      - name: Verificar librerias cientificas
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          python - <<'PY'
          import numpy
          import pandas
          import scipy
          import matplotlib
          import requests
          import cartopy
          import numba
          import PIL
          import edge_tts
          import gtts
          import pycountry
          import geopy
          import shapely

          print("===================================")
          print("MODULOS CIENTIFICOS VERIFICADOS")
          print("===================================")

          print("NumPy:", numpy.__version__)
          print("Pandas:", pandas.__version__)
          print("SciPy:", scipy.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Cartopy:", cartopy.__version__)
          print("Numba:", numba.__version__)
          print("Shapely:", shapely.__version__)

          print("===================================")
          print("DEPENDENCIAS LISTAS")
          print("===================================")
          PY

      # ==========================================
      # 6. VALIDAR PROGRAMAS PYTHON
      # ==========================================

      - name: Verificar archivos y sintaxis
        shell: bash
        run: |
          set -euo pipefail

          echo "Comprobando archivos Python..."

          if [[ ! -f sismonauta_etas_publicar.py ]]; then
            echo "::error::Falta sismonauta_etas_publicar.py"
            exit 1
          fi

          if [[ ! -f etas_multipaís_24h_animado.py ]]; then
            echo "::error::Falta etas_multipaís_24h_animado.py"
            exit 1
          fi

          python -m py_compile \
            sismonauta_etas_publicar.py \
            etas_multipaís_24h_animado.py

          echo "==================================="
          echo "AMBOS ARCHIVOS PYTHON VERIFICADOS"
          echo "==================================="

      # ==========================================
      # 7. DETERMINAR MODO DE EJECUCION
      # ==========================================

      - name: Determinar modo de ejecucion
        id: modo
        shell: bash

        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}

        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "::error::Evento no autorizado"
            exit 1
          fi

          if [[ "$REQUESTED_PUBLISH" == "true" ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "==================================="
          echo "SISMONAUTA - ETAS CHILE"
          echo "==================================="
          echo "Pais: Chile"
          echo "Evento: $EVENT_NAME"
          echo "Publicar: $PUBLISH"
          echo "Instagram: @sismonauta"
          echo "Facebook: Sismonauta"
          echo "==================================="

          echo "Fecha UTC:"
          date -u

          echo "Fecha y hora de Chile:"
          TZ=America/Santiago date

      # ==========================================
      # 8. VALIDAR CREDENCIALES
      # ==========================================

      - name: Verificar secretos de Meta
        shell: bash

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}

        run: |
          set -euo pipefail

          if [[ "$PUBLISH" == "true" ]]; then

            for name in \
              INSTAGRAM_TOKEN \
              INSTAGRAM_USER_ID \
              FACEBOOK_PAGE_ID \
              FACEBOOK_PAGE_TOKEN
            do

              if [[ -z "${!name:-}" ]]; then
                echo "::error::Falta secreto: $name"
                exit 1
              fi

            done

            echo "Credenciales disponibles"

          else

            echo "Modo vista previa"
            echo "No se requieren secretos Meta"

          fi

      # ==========================================
      # 9. EJECUTAR ETAS CHILE
      # ==========================================

      - name: Generar y publicar video ETAS
        id: ejecutar

        shell: bash
        timeout-minutes: 335

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}

        run: |
          set -uo pipefail

          args=(
            --out output_etas
            --original 'etas_multipaís_24h_animado.py'
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "==================================="
          echo "GENERACION ETAS CHILE"
          echo "==================================="
          echo "Pais: Chile"
          echo "Modelo: ETAS experimental"
          echo "25 mapas horarios"
          echo "2 mapas de calor simultaneos"
          echo "Narracion y musica"
          echo "Reel vertical para Instagram"
          echo "Video original para Facebook"
          echo "Publicar: $PUBLISH"
          echo "==================================="

          python sismonauta_etas_publicar.py "${args[@]}"

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "Codigo Python: $CODE"

          # El paso siguiente interpreta el recibo.
          exit 0

      # ==========================================
      # 10. VERIFICAR RESULTADOS
      # ==========================================

      - name: Evaluar recibo de publicacion
        shell: bash

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          EXIT_CODE: ${{ steps.ejecutar.outputs.exit_code }}

        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          receipt = Path(
              "output_etas/estado_publicacion.json"
          )

          if not receipt.exists():
              raise SystemExit(
                  "::error::No existe recibo ETAS"
              )

          try:
              data = json.loads(
                  receipt.read_text(
                      encoding="utf-8"
                  )
              )
          except Exception as exc:
              raise SystemExit(
                  "::error::Recibo invalido: " + str(exc)
              )

          exit_code = int(
              os.environ.get("EXIT_CODE") or "1"
          )

          status = data.get("status")
          country = data.get("country")

          print("===================================")
          print("VERIFICACION ETAS SISMONAUTA")
          print("===================================")
          print("Pais:", country)
          print("Estado:", status)
          print("Codigo Python:", exit_code)

          # --------------------------------------
          # VALIDAR PAIS
          # --------------------------------------

          if country != "Chile":
              raise SystemExit(
                  "::error::El pais no es Chile"
              )

          # --------------------------------------
          # VALIDAR ERRORES
          # --------------------------------------

          if exit_code != 0:
              raise SystemExit(
                  "::error::Error durante generacion "
                  "o publicacion del video"
              )

          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Publicacion parcial o incierta"
              )

          # --------------------------------------
          # PUBLICACION REAL
          # --------------------------------------

          if os.environ.get("PUBLISH") == "true":

              if status != "published":
                  raise SystemExit(
                      "::error::Publicacion no confirmada"
                  )

              targets = data.get("targets", {})

              for platform in (
                  "instagram",
                  "facebook"
              ):

                  item = targets.get(
                      platform, {}
                  )

                  if (
                      item.get("status") != "published"
                      or not item.get("id")
                  ):
                      raise SystemExit(
                          "::error::Falta confirmacion de "
                          + platform
                      )

                  print(
                      "PUBLICACION REGISTRADA:",
                      platform,
                      "ID:",
                      item["id"]
                  )

          # --------------------------------------
          # VISTA PREVIA
          # --------------------------------------

          else:

              if status != "preview_only":
                  raise SystemExit(
                      "::error::Vista previa no confirmada"
                  )

              print(
                  "VIDEO GENERADO SIN PUBLICAR"
              )

          print("===================================")
          print("VERIFICACION COMPLETADA")
          print("===================================")
          PYVERIFY

      # ==========================================
      # 11. RESUMEN EN GITHUB ACTIONS
      # ==========================================

      - name: Registrar resumen de ejecucion
        if: always()
        shell: bash

        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          EXIT_CODE: ${{ steps.ejecutar.outputs.exit_code }}

        run: |
          {
            echo "## SISMONAUTA ETAS CHILE"
            echo ""
            echo "- Pais: Chile"
            echo "- Evento: $GITHUB_EVENT_NAME"
            echo "- Publicar: ${PUBLISH:-desconocido}"
            echo "- Codigo Python: ${EXIT_CODE:-no ejecutado}"
            echo "- Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Hora Chile: $(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f output_etas/estado_publicacion.json ]]; then

            {
              echo "### Resultado de ejecucion"
              echo ""
              echo '```json'

              python -m json.tool \
                output_etas/estado_publicacion.json \
                2>/dev/null || echo "Recibo no legible"

              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

          fi

      # ==========================================
      # 12. GUARDAR VIDEOS Y REGISTROS
      # ==========================================

      - name: Guardar archivos generados
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: sismonauta-etas-${{ github.run_id }}-${{ github.run_attempt }}

          path: |
            output_etas/estado_publicacion.json
            output_etas/sismonauta_etas_reel_9x16.mp4
            /mnt/data/ETAS_DOBLE_HEATMAP_CON_LIKE.mp4

          if-no-files-found: warn

          retention-days: 7
