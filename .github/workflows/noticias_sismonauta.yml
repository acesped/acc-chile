
name: SISMONAUTA - Noticias cientificas diarias

on:
  # Ejecucion manual desde GitHub Actions
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

  # Publicacion diaria a las 07:00 AM de Chile
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/Santiago'

permissions:
  contents: write

concurrency:
  group: sismonauta-noticias
  cancel-in-progress: false

jobs:
  noticias:
    name: Buscar, redactar y publicar noticia
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: '1'

      # GitHub
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # Instagram
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # Facebook
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # Proveedores de IA para explicaciones extensas
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Modelos configurables
      GEMINI_NEWS_MODEL: 'gemini-2.5-flash'
      OPENROUTER_NEWS_MODEL: 'openai/gpt-4o-mini'
      GROQ_NEWS_MODEL: 'llama-3.3-70b-versatile'

      # API Meta
      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: 'sismonauta'
      FACEBOOK_EXPECTED_USERNAME: 'sismonauta'

    steps:
      # ==========================================
      # 1. OBTENER REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ==========================================
      # 2. CONFIGURAR PYTHON
      # ==========================================

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================
      # 3. INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Instalar librerias
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13'

      # ==========================================
      # 4. COMPROBAR ARCHIVO PYTHON
      # ==========================================

      - name: Verificar programa
        shell: bash
        run: |
          set -euo pipefail

          test -f noticias_sismonauta.py || {
            echo "::error::Falta noticias_sismonauta.py"
            exit 1
          }

          python -m py_compile noticias_sismonauta.py

          echo "Python verificado correctamente"

      # ==========================================
      # 5. SELECCIONAR MODO DE EJECUCION
      # ==========================================

      - name: Determinar modo de publicacion
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            PUBLISH=true
          elif [[ "$MANUAL_PUBLISH" == "true" ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "Evento: $EVENT_NAME"
          echo "Publicacion activada: $PUBLISH"
          echo "Destino Instagram: @sismonauta"
          echo "Destino Facebook: SISMONAUTA"

      # ==========================================
      # 6. COMPROBAR CREDENCIALES
      # ==========================================

      - name: Verificar secretos necesarios
        if: ${{ steps.modo.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            INSTAGRAM_TOKEN \
            INSTAGRAM_USER_ID \
            FACEBOOK_PAGE_ID \
            FACEBOOK_PAGE_TOKEN
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta el secreto $name"
              exit 1
            fi
          done

          if [[ \
            -z "${GEMINI_API_KEY:-}" && \
            -z "${OPENROUTER_API_KEY:-}" && \
            -z "${GROQ_API_KEY:-}" \
          ]]; then
            echo "::error::Configura al menos una clave de IA"
            echo "::error::GEMINI_API_KEY, OPENROUTER_API_KEY o GROQ_API_KEY"
            exit 1
          fi

          echo "Credenciales presentes"

      # ==========================================
      # 7. BUSCAR, REDACTAR Y PUBLICAR
      # ==========================================

      - name: Procesar noticia del dia
        id: ejecutar
        shell: bash
        timeout-minutes: 32
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail

          args=(--out output_noticias)

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "==================================="
          echo "SISMONAUTA - NOTICIAS"
          echo "==================================="
          echo "Publicar: $PUBLISH"
          echo "Periodo: ultimas 24 horas"
          echo "Idiomas: espanol e ingles"
          echo "Descripcion: explicacion extensa"
          echo "Imagen: banner azul y letras blancas"
          echo "Destinos: Instagram y Facebook"
          echo "==================================="

          python noticias_sismonauta.py "${args[@]}"
          code=$?

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Codigo de salida: $code"

          # El siguiente paso comprueba tanto
          # el codigo de salida como el recibo.
          exit 0

      # ==========================================
      # 8. VERIFICAR RESULTADOS
      # ==========================================

      - name: Confirmar resultado de la ejecucion
        if: ${{ always() && steps.ejecutar.conclusion == 'success' }}
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          SCRIPT_EXIT: ${{ steps.ejecutar.outputs.exit_code }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          receipt = Path(
              "output_noticias/estado_publicacion.json"
          )

          publish = (
              os.environ.get("PUBLISH") == "true"
          )

          exit_code = int(
              os.environ.get("SCRIPT_EXIT") or "1"
          )

          if not receipt.exists():
              raise SystemExit(
                  "::error::No existe recibo de resultados"
              )

          data = json.loads(
              receipt.read_text(encoding="utf-8")
          )

          status = data.get("status")

          print("Modo publicacion:", publish)
          print("Codigo Python:", exit_code)
          print("Estado:", status)

          # Los errores tecnicos no deben
          # confundirse con ausencia de noticias.
          if exit_code not in (0, 2, 3):
              raise SystemExit(
                  "::error::Error tecnico del programa. "
                  "Revisar el registro de ejecucion."
              )

          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Publicacion parcial o incierta. "
                  "Revisar ambas plataformas antes de repetir."
              )

          # No se encontro noticia elegible.
          no_news = {
              "no_eligible_news",
              "no_licensed_relevant_photo",
          }

          if status in no_news:
              print(
                  "::notice::Sin publicacion hoy: "
                  + status
              )
              raise SystemExit(0)

          # Solo vista previa.
          if not publish:
              if status != "preview_only":
                  raise SystemExit(
                      "::error::Resultado inesperado "
                      "en modo vista previa: "
                      + str(status)
                  )

              print(
                  "Vista previa generada correctamente"
              )
              raise SystemExit(0)

          # Publicacion real.
          if exit_code != 0:
              raise SystemExit(
                  "::error::La publicacion no finalizo "
                  "correctamente"
              )

          if status != "published":
              raise SystemExit(
                  "::error::No se confirmo la publicacion "
                  "en ambas redes"
              )

          targets = data.get("targets", {})

          for site in ("instagram", "facebook"):
              item = targets.get(site, {})

              if (
                  item.get("status") != "published"
                  or not str(item.get("id") or "").strip()
              ):
                  raise SystemExit(
                      "::error::Publicacion no confirmada: "
                      + site
                  )

              print(
                  "PUBLICACION CONFIRMADA:",
                  site,
                  "ID:",
                  item["id"]
              )

          print(
              "SISMONAUTA: noticias publicadas "
              "en Instagram y Facebook"
          )
          PYVERIFY

      # ==========================================
      # 9. CONSERVAR EVIDENCIAS
      # ==========================================

      - name: Guardar imagen, noticia y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-sismonauta-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_noticias/
          if-no-files-found: warn
          retention-days: 14
