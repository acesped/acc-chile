
name: SISMONAUTA - Noticias cientificas diarias

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

  # Todos los dias a las 07:00 AM, hora de Chile
  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/Santiago'

permissions:
  contents: write

concurrency:
  group: sismonauta-noticias
  cancel-in-progress: false

jobs:
  noticias:
    name: Buscar, redactar y publicar noticia
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PYTHONUNBUFFERED: '1'

      # GitHub
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # Instagram
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # Facebook
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # Inteligencia artificial: tres proveedores
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      # Modelos configurables
      GEMINI_NEWS_MODEL: 'gemini-2.5-flash'
      OPENROUTER_NEWS_MODEL: 'openai/gpt-4o-mini'
      GROQ_NEWS_MODEL: 'llama-3.3-70b-versatile'

      # Meta Graph API
      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: 'sismonauta'
      FACEBOOK_EXPECTED_USERNAME: 'sismonauta'

    steps:
      # ==========================================
      # 1. DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ==========================================
      # 2. CONFIGURAR PYTHON
      # ==========================================

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================
      # 3. INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Instalar librerias
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13'

      # ==========================================
      # 4. VALIDAR ARCHIVO PYTHON
      # ==========================================

      - name: Verificar programa Python
        shell: bash
        run: |
          set -euo pipefail

          test -f noticias_sismonauta.py || {
            echo "::error::Falta noticias_sismonauta.py"
            exit 1
          }

          python -m py_compile noticias_sismonauta.py

          echo "Python verificado correctamente"

      # ==========================================
      # 5. DETERMINAR MODO DE EJECUCION
      # ==========================================

      - name: Determinar modo de publicacion
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            PUBLISH=true
          elif [[ "$MANUAL_PUBLISH" == "true" ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "==================================="
          echo "SISMONAUTA - NOTICIAS"
          echo "==================================="
          echo "Evento: $EVENT_NAME"
          echo "Publicacion: $PUBLISH"
          echo "Instagram: @sismonauta"
          echo "Facebook: Sismonauta"
          echo "==================================="

      # ==========================================
      # 6. COMPROBAR CREDENCIALES
      # ==========================================

      - name: Validar secretos y proveedores IA
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail

          if [[ "$PUBLISH" == "true" ]]; then
            for name in \
              INSTAGRAM_TOKEN \
              INSTAGRAM_USER_ID \
              FACEBOOK_PAGE_ID \
              FACEBOOK_PAGE_TOKEN
            do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Falta secreto: $name"
                exit 1
              fi
            done
          fi

          HAS_AI=false

          if [[ -n "${GEMINI_API_KEY:-}" ]]; then
            echo "Gemini configurado"
            HAS_AI=true
          fi

          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            echo "OpenRouter configurado"
            HAS_AI=true
          fi

          if [[ -n "${GROQ_API_KEY:-}" ]]; then
            echo "Groq configurado"
            HAS_AI=true
          fi

          if [[ "$HAS_AI" != "true" ]]; then
            echo "::error::No hay proveedor de IA configurado"
            echo "::error::Agrega GEMINI_API_KEY, OPENROUTER_API_KEY o GROQ_API_KEY"
            exit 1
          fi

          echo "Credenciales disponibles para ejecutar noticias"

      # ==========================================
      # 7. BUSCAR NOTICIAS, REDACTAR Y PUBLICAR
      # ==========================================

      - name: Procesar noticia del dia
        id: ejecutar
        shell: bash
        timeout-minutes: 32
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail

          args=(--out output_noticias)

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "==================================="
          echo "BUSQUEDA Y PUBLICACION"
          echo "==================================="
          echo "Ultimas 24 horas"
          echo "Idiomas: espanol e ingles"
          echo "Traduccion al espanol"
          echo "Explicacion cientifica extensa"
          echo "Banner azul, texto blanco"
          echo "Contorno negro en titular"
          echo "Publicar: $PUBLISH"
          echo "==================================="

          python noticias_sismonauta.py "${args[@]}"
          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Codigo Python: $CODE"

          # El siguiente paso analiza el recibo
          # y distingue errores de dias sin noticias.
          exit 0

      # ==========================================
      # 8. VERIFICAR PUBLICACIONES
      # ==========================================

      - name: Confirmar resultados en Instagram y Facebook
        if: ${{ steps.ejecutar.conclusion == 'success' }}
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          SCRIPT_EXIT: ${{ steps.ejecutar.outputs.exit_code }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          receipt = Path(
              "output_noticias/estado_publicacion.json"
          )

          publish = (
              os.environ.get("PUBLISH") == "true"
          )

          exit_code = int(
              os.environ.get("SCRIPT_EXIT") or "1"
          )

          if not receipt.exists():
              raise SystemExit(
                  "::error::No existe recibo de resultados"
              )

          data = json.loads(
              receipt.read_text(encoding="utf-8")
          )

          status = data.get("status")

          print("Publicacion solicitada:", publish)
          print("Codigo Python:", exit_code)
          print("Estado real:", status)

          # Errores tecnicos o publicaciones inciertas
          if exit_code not in (0, 2, 3):
              raise SystemExit(
                  "::error::El programa termino con error"
              )

          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Publicacion parcial o incierta. "
                  "Revisar Meta antes de reintentar."
              )

          # Ausencia de noticia o imagen valida
          no_news = {
              "no_eligible_news",
              "no_licensed_relevant_photo",
          }

          if status in no_news:
              print(
                  "::notice::SIN PUBLICACION HOY: "
                  + status
              )
              raise SystemExit(0)

          # Vista previa manual
          if not publish:
              if status != "preview_only":
                  raise SystemExit(
                      "::error::Resultado inesperado "
                      "en modo vista previa: "
                      + str(status)
                  )

              print(
                  "VISTA PREVIA GENERADA CORRECTAMENTE"
              )
              raise SystemExit(0)

          # Confirmar publicaciones reales
          if exit_code != 0 or status != "published":
              raise SystemExit(
                  "::error::Publicacion no confirmada"
              )

          targets = data.get("targets", {})

          for site in ("instagram", "facebook"):
              item = targets.get(site, {})

              if (
                  item.get("status") != "published"
                  or not str(item.get("id") or "").strip()
              ):
                  raise SystemExit(
                      "::error::Falta confirmacion de "
                      + site
                  )

              print(
                  "PUBLICACION CONFIRMADA:",
                  site,
                  "ID:",
                  item["id"]
              )

          print(
              "SISMONAUTA: noticia publicada "
              "en Instagram y Facebook"
          )
          PYVERIFY

      # ==========================================
      # 9. GUARDAR EVIDENCIAS
      # ==========================================

      - name: Guardar imagen y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-sismonauta-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_noticias/
          if-no-files-found: warn
          retention-days: 14
