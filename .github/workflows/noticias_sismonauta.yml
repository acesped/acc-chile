
name: SISMONAUTA - Noticias sismicas 07 Chile

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

  schedule:
    - cron: '0 7 * * *'
      timezone: 'America/Santiago'

permissions:
  contents: write

concurrency:
  group: sismonauta-noticias
  cancel-in-progress: false

jobs:
  noticias:
    name: Buscar y publicar noticia sismica
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      IG_GRAPH_VERSION: 'v25.0'

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13'

      - name: Validar Python
        shell: bash
        run: |
          set -euo pipefail
          test -f noticias_sismonauta.py
          python -m py_compile noticias_sismonauta.py

      - name: Determinar modo de publicacion
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" ]]; then
            PUBLISH=true
          elif [[ "$MANUAL_PUBLISH" == "true" ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Publicacion activada: $PUBLISH"

      - name: Buscar noticia y procesar publicacion
        id: ejecutar
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail

          args=(--out output_noticias)

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "Modo publicacion: $PUBLISH"

          python noticias_sismonauta.py "${args[@]}"
          code=$?

          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Codigo de salida Python: $code"

          # Los resultados se revisan en el siguiente paso.
          # Si hubo un error, el verificador lo identificara.
          exit 0

      - name: Verificar resultado real
        if: always() && steps.ejecutar.conclusion == 'success'
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          SCRIPT_EXIT: ${{ steps.ejecutar.outputs.exit_code }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          receipt = Path(
              "output_noticias/estado_publicacion.json"
          )

          exit_code = int(
              os.environ.get("SCRIPT_EXIT") or "1"
          )

          publish = (
              os.environ.get("PUBLISH") == "true"
          )

          if not receipt.exists():
              raise SystemExit(
                  "::error::No existe recibo de resultados"
              )

          data = json.loads(
              receipt.read_text(encoding="utf-8")
          )

          status = data.get("status")

          print("Publicacion solicitada:", publish)
          print("Codigo Python:", exit_code)
          print("Estado del recibo:", status)

          no_news = {
              "no_eligible_news",
              "no_licensed_relevant_photo",
          }

          # Error tecnico o parcial: nunca ocultarlo.
          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Publicacion parcial o incierta. "
                  "Revisar Meta antes de reintentar."
              )

          # Si no habia noticia o fotografia valida,
          # no debe exigirse un ID de publicacion.
          if status in no_news:
              if exit_code not in (0, 2, 3):
                  raise SystemExit(
                      "::error::Error tecnico durante "
                      "la busqueda de noticias"
                  )

              print(
                  "::notice::SIN PUBLICACION HOY: "
                  + status
              )
              raise SystemExit(0)

          # Cualquier otro error del programa
          # debe hacer fallar el workflow.
          if exit_code != 0:
              raise SystemExit(
                  "::error::Python termino con error: "
                  + str(exit_code)
              )

          # Ejecucion manual de vista previa.
          if not publish:
              if status != "preview_only":
                  raise SystemExit(
                      "::error::Estado inesperado "
                      "para vista previa: " + str(status)
                  )

              print("Vista previa generada correctamente")
              raise SystemExit(0)

          # Publicacion real solicitada.
          if status != "published":
              raise SystemExit(
                  "::error::Publicacion no confirmada. "
                  "Estado: " + str(status)
              )

          targets = data.get("targets", {})

          for site in ("instagram", "facebook"):
              item = targets.get(site, {})

              if (
                  item.get("status") != "published"
                  or not str(item.get("id") or "").strip()
              ):
                  raise SystemExit(
                      "::error::Publicacion no confirmada: "
                      + site
                  )

              print(
                  "PUBLICACION CONFIRMADA:",
                  site,
                  "ID:",
                  item["id"]
              )

          print(
              "SISMONAUTA: publicaciones "
              "confirmadas en ambas plataformas"
          )
          PYVERIFY

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-sismonauta-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_noticias/
          if-no-files-found: warn
          retention-days: 14
