name: SISMONAUTA - Noticias cientificas diarias

# cron-job.org activa workflow_dispatch con publish=true.
# Horarios 07:30 y 19:30 America/Santiago configurados en cron-job.org.
# Sin schedule interno de GitHub.
"on":
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook Feed'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# Serializar solo las ejecuciones de Noticias que editan el mismo estado.
concurrency:
  group: sismonauta-noticias
  cancel-in-progress: false

jobs:
  noticias:
    name: Buscar, redactar y publicar noticia
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_NEWS_MODEL: 'gemini-2.5-flash'
      OPENROUTER_NEWS_MODEL: 'openai/gpt-4o-mini'
      GROQ_NEWS_MODEL: 'llama-3.3-70b-versatile'
      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: 'sismonauta'
      FACEBOOK_EXPECTED_USERNAME: 'sismonauta'

    steps:
      - name: Identificar origen de ejecucion
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          echo '===================================' 
          echo 'SISMONAUTA - NOTICIAS'
          echo '===================================' 
          echo "Evento: $EVENT_NAME"
          echo "Actor GitHub: $ACTOR"
          echo "Publicacion solicitada: $REQUESTED_PUBLISH"
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Fecha UTC: $(date -u)"
          echo "Fecha Chile: $(TZ=America/Santiago date)"
          echo 'Activacion: workflow_dispatch (cron-job.org o manual)'

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13'
          echo 'Dependencias instaladas correctamente'

      - name: Verificar programa Python
        shell: bash
        run: |
          set -euo pipefail
          test -f noticias_sismonauta.py || {
            echo '::error::Falta noticias_sismonauta.py'
            exit 1
          }
          python -m py_compile noticias_sismonauta.py
          echo 'Sintaxis Python verificada'

      - name: Determinar modo de publicacion
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != 'workflow_dispatch' ]]; then
            echo '::error::Evento no autorizado para este workflow'
            exit 1
          fi
          if [[ "$REQUESTED_PUBLISH" == 'true' ]]; then
            PUBLISH=true
          else
            PUBLISH=false
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Modo publicar: $PUBLISH"
          echo 'Destino Instagram: @sismonauta, foto'
          echo 'Destino Facebook: fanpage, un solo post publico con imagen adjunta'
          echo 'Facebook /photos published=true: NO se utiliza'

      - name: Validar secretos y proveedores IA
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISH" == 'true' ]]; then
            for name in INSTAGRAM_TOKEN INSTAGRAM_USER_ID FACEBOOK_PAGE_ID FACEBOOK_PAGE_TOKEN; do
              if [[ -z "${!name:-}" ]]; then
                echo "::error::Falta secreto: $name"
                exit 1
              fi
            done
          fi
          HAS_AI=false
          for name in GEMINI_API_KEY OPENROUTER_API_KEY GROQ_API_KEY; do
            if [[ -n "${!name:-}" ]]; then
              echo "Proveedor configurado: ${name%_API_KEY}"
              HAS_AI=true
            fi
          done
          if [[ "$HAS_AI" != 'true' ]]; then
            echo '::error::No hay proveedor IA configurado'
            exit 1
          fi
          echo 'Configuracion validada'

      - name: Procesar noticia del dia
        id: ejecutar
        shell: bash
        timeout-minutes: 32
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail
          mkdir -p output_noticias
          rm -f output_noticias/estado_publicacion.json
          args=(--out output_noticias)
          if [[ "$PUBLISH" == 'true' ]]; then
            args+=(--publish)
          fi
          echo '===================================' 
          echo 'BUSQUEDA Y PUBLICACION'
          echo 'Idiomas: espanol e ingles'
          echo 'Redaccion cientifica y generacion de imagen'
          echo "Publicar: $PUBLISH"
          echo 'Instagram: foto | Facebook: solo post feed con imagen'
          echo '===================================' 
          python noticias_sismonauta.py "${args[@]}"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Codigo de salida Python: $CODE"
          # El verificador final decide si la ejecucion fue valida.
          exit 0

      - name: Confirmar resultados en Instagram y Facebook Feed
        id: verificar
        if: ${{ steps.ejecutar.conclusion == 'success' }}
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          SCRIPT_EXIT: ${{ steps.ejecutar.outputs.exit_code }}
        run: |
          set -euo pipefail
          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          receipt = Path('output_noticias/estado_publicacion.json')
          publish = os.environ.get('PUBLISH', '').lower() == 'true'
          exit_value = os.environ.get('SCRIPT_EXIT', '')
          try:
              exit_code = int(exit_value)
          except (ValueError, TypeError):
              raise SystemExit('::error::No se registro un codigo de salida valido del programa')

          if not receipt.exists():
              raise SystemExit('::error::No existe recibo de resultados')
          try:
              data = json.loads(receipt.read_text(encoding='utf-8'))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit('::error::Recibo invalido: ' + str(exc))
          if not isinstance(data, dict):
              raise SystemExit('::error::El recibo debe ser un objeto JSON')

          status = data.get('status')
          print('Publicacion solicitada:', publish)
          print('Codigo Python:', exit_code)
          print('Estado real:', status)

          # No se acepta como correcto un fallo del proceso, incluso si quedo
          # un recibo previo o parcial en el directorio.
          if exit_code != 0:
              raise SystemExit('::error::El programa termino con error: ' + str(exit_code))

          if status in ('partial_or_uncertain', 'uncertain_previous'):
              raise SystemExit(
                  '::error::Publicacion parcial o incierta. Revisar Meta y state.json; '
                  'no reintentar a ciegas.'
              )

          no_news = {'no_eligible_news', 'no_licensed_relevant_photo'}
          if status in no_news:
              print('::notice::SIN PUBLICACION: ' + str(status))
              raise SystemExit(0)

          if not publish:
              if status != 'preview_only':
                  raise SystemExit('::error::Resultado inesperado en vista previa: ' + str(status))
              print('VISTA PREVIA GENERADA CORRECTAMENTE')
              raise SystemExit(0)

          if status not in ('published', 'already_published'):
              raise SystemExit('::error::Publicacion no confirmada: ' + str(status))

          targets = data.get('targets') or {}
          if not isinstance(targets, dict):
              raise SystemExit('::error::Recibo sin mapa de destinos')

          # El destino antiguo "facebook" representa la foto publica duplicada.
          # NO se debe exigir ni reenviar. Solo cuenta facebook_feed.
          for site in ('instagram', 'facebook_feed'):
              item = targets.get(site) or {}
              identifier = str(item.get('id') or '').strip()
              if item.get('status') != 'published' or not identifier:
                  raise SystemExit('::error::Falta confirmacion de ' + site)
              print('PUBLICACION CONFIRMADA:', site, 'ID:', identifier)

          print('SISMONAUTA: Instagram foto + unico post publico Facebook Feed con imagen')
          PYVERIFY

      - name: Registrar resumen de ejecucion
        if: always()
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          SCRIPT_EXIT: ${{ steps.ejecutar.outputs.exit_code }}
          VERIFY_RESULT: ${{ steps.verificar.outcome }}
        run: |
          {
            echo '## SISMONAUTA - Noticias'
            echo ''
            echo '- Destinos: Instagram foto + Facebook Feed post publico con imagen'
            echo '- Facebook Foto independiente: deshabilitada'
            echo "- Evento: $GITHUB_EVENT_NAME"
            echo "- Publicacion solicitada: ${PUBLISH:-desconocida}"
            echo "- Codigo Python: ${SCRIPT_EXIT:-no ejecutado}"
            echo "- Resultado verificacion: ${VERIFY_RESULT:-no ejecutada}"
            echo "- Repositorio: $GITHUB_REPOSITORY"
            echo "- Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Fecha Chile: $(TZ=America/Santiago date '+%Y-%m-%d %H:%M:%S %Z')"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f output_noticias/estado_publicacion.json ]]; then
            {
              echo '### Recibo de publicacion'
              echo ''
              echo '```json'
              python -m json.tool output_noticias/estado_publicacion.json 2>/dev/null || echo 'Recibo no legible'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar imagen y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noticias-sismonauta-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_noticias/
          if-no-files-found: warn
          retention-days: 14
