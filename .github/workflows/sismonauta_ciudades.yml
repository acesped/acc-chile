- name: Monitorear EMSC y publicar
  shell: bash
  timeout-minutes: 18
  env:
    PUBLISH: ${{ steps.mode.outputs.publish }}
  run: |
    set -euo pipefail

    args=(
      --out output_ciudades
      --lookback-hours 24
    )

    if [[ "$PUBLISH" == "true" ]]; then
      args+=(--publish)
    fi

    python sismonauta_ciudades.py "${args[@]}"
