name: SISMONAUTA - Alertas Ciudades EMSC

# El ciclo externo de cinco minutos lo activa cron-job.org mediante
# workflow_dispatch o repository_dispatch. No se configura schedule.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook (foto y feed)'
        required: true
        type: boolean
        default: true
  repository_dispatch:
    types:
      - sismonauta-ciudades-emsc

permissions:
  contents: write

# Evita dos ejecuciones simultáneas de este monitor.
# GitHub puede sustituir ejecuciones pendientes de un mismo grupo:
# la ventana retrospectiva del Python ayuda a recuperar eventos.
concurrency:
  group: sismonauta-ciudades-emsc
  cancel-in-progress: false

jobs:
  monitoreo_emsc:
    name: Monitorear EMSC y publicar (ciclo nominal 10 min)
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_DEFAULT_TIMEOUT: '25'
      PIP_RETRIES: '2'
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      META_GRAPH_VERSION: 'v25.0'
      IG_GRAPH_BASE: 'https://graph.instagram.com'
      EMSC_RECOVERY_MINUTES: '300'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias binarias sin apt-get
        shell: bash
        timeout-minutes: 7
        run: |
          set -euo pipefail
          echo 'Instalando dependencias desde wheels; sin apt-get ni compilacion nativa'
          python -m pip install \
            --only-binary=:all: \
            --prefer-binary \
            'requests>=2.31,<3' \
            'Pillow>=10,<13' \
            'matplotlib>=3.8,<4' \
            'cartopy>=0.23,<1' \
            'shapely>=2,<3' \
            'pyproj>=3.6,<4'
          python - <<'PYDEPS'
          import requests, PIL, matplotlib, cartopy, shapely, pyproj
          matplotlib.use('Agg')
          import cartopy.crs as ccrs
          assert ccrs.PlateCarree() is not None
          print('Dependencias validadas:')
          for package in (requests, PIL, matplotlib, cartopy, shapely, pyproj):
              print(package.__name__, package.__version__)
          PYDEPS

      - name: Validar script y pruebas locales sin red
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          if [[ ! -f sismonauta_ciudades.py ]]; then
            echo '::error::Falta sismonauta_ciudades.py en la raiz del repositorio'
            exit 1
          fi
          python -m py_compile sismonauta_ciudades.py
          python sismonauta_ciudades.py --help
          python sismonauta_ciudades.py --test
          echo 'Script, filtros, historial y tres destinos validados localmente'

      - name: Determinar modo de publicacion
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          DISPATCH_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ "$MANUAL_PUBLISH" == 'true' ]]; then PUBLISH=true
              else PUBLISH=false; fi
              ;;
            repository_dispatch)
              if [[ "$DISPATCH_ACTION" != 'sismonauta-ciudades-emsc' ]]; then
                echo '::error::repository_dispatch no autorizado'; exit 1
              fi
              PUBLISH=true
              ;;
            *)
              echo '::error::Evento no autorizado'; exit 1
              ;;
          esac
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "SISMONAUTA EMSC | evento=$EVENT_NAME | publicar=$PUBLISH"
          echo '15 ciudades; magnitud M4.0 a M6.9; radio 100 km'
          echo 'Ciclo nominal: 10 min; recuperacion retrospectiva: 300 min'
          echo 'Destinos: instagram, facebook (foto), facebook_feed (post con foto)'

      - name: Verificar credenciales necesarias
        if: ${{ steps.modo.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          for key in GH_TOKEN GITHUB_REPOSITORY GITHUB_REF_NAME \
                     INSTAGRAM_TOKEN INSTAGRAM_USER_ID FACEBOOK_PAGE_ID FACEBOOK_PAGE_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Falta credencial: $key"; exit 1
            fi
          done
          for name in INSTAGRAM_USER_ID FACEBOOK_PAGE_ID; do
            if [[ ! "${!name}" =~ ^[0-9]+$ ]]; then
              echo "::error::$name debe ser numerico"; exit 1
            fi
          done
          echo 'Credenciales presentes; cada cuenta se validara independientemente antes de publicar'

      - name: Preparar salida limpia
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output_ciudades
          rm -f output_ciudades/estado_publicacion.json

      - name: Monitorear EMSC y publicar
        id: monitoreo
        shell: bash
        timeout-minutes: 14
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail
          args=(--out output_ciudades --lookback-minutes 10)
          if [[ "$PUBLISH" == 'true' ]]; then args+=(--publish); fi
          echo "Consulta EMSC | publicar=$PUBLISH | ciclo nominal 10 min | recuperacion $EMSC_RECOVERY_MINUTES min"
          python sismonauta_ciudades.py "${args[@]}"
          CODE=$?
          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Codigo de salida Python: $CODE"
          # El paso siguiente determina el resultado usando el recibo.
          exit 0

      - name: Verificar recibo y publicaciones
        if: ${{ steps.monitoreo.conclusion == 'success' }}
        shell: bash
        env:
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail
          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          path = Path('output_ciudades/estado_publicacion.json')
          if not path.is_file():
              raise SystemExit('::error::No existe recibo de ejecucion')
          try:
              data = json.loads(path.read_text(encoding='utf-8'))
          except (OSError, ValueError) as exc:
              raise SystemExit('::error::Recibo no legible: ' + str(exc))
          try:
              code = int(os.environ.get('SCRIPT_EXIT', ''))
          except ValueError:
              raise SystemExit('::error::Codigo de salida Python no disponible')
          publish = os.environ.get('PUBLISH') == 'true'
          status = data.get('status')
          events = data.get('events')
          print('Python:', code, '| Estado:', status, '| Publicar:', publish)
          print('Fuente:', data.get('source'), '| Ventana nominal:', data.get('lookback_minutes'))
          print('Ventana de recuperacion:', data.get('recovery_minutes'), 'minutos')
          if code != 0:
              raise SystemExit('::error::El script finalizo con error; revisar el recibo y los logs')
          if data.get('source') != 'EMSC-CSEM':
              raise SystemExit('::error::Fuente inesperada')
          if data.get('lookback_hours') != 0 or data.get('lookback_minutes') != 10:
              raise SystemExit('::error::Ventana nominal inesperada')
          if data.get('publish_requested') is not publish:
              raise SystemExit('::error::Modo de publicacion inconsistente')
          if not isinstance(events, list):
              raise SystemExit('::error::Campo events invalido')
          if status == 'no_new_event':
              if events:
                  raise SystemExit('::error::Recibo inconsistente: no_new_event con eventos')
              print('::notice::Sin eventos pendientes de publicacion')
          elif status == 'preview_only':
              if publish or not events or not all(e.get('status') == 'preview_only' for e in events):
                  raise SystemExit('::error::Vista previa inconsistente')
              print('::notice::Vista previa generada sin publicar')
          elif status == 'published':
              if not publish or not events:
                  raise SystemExit('::error::Publicacion sin eventos o en modo previo')
              for event in events:
                  event_id = str(event.get('id') or '')
                  if not event_id or event.get('status') not in ('published', 'already_published'):
                      raise SystemExit('::error::Evento sin confirmacion: ' + event_id)
                  targets = event.get('targets') or {}
                  for platform in ('instagram', 'facebook', 'facebook_feed'):
                      target = targets.get(platform) or {}
                      if target.get('status') != 'published' or not str(target.get('id') or '').strip():
                          raise SystemExit('::error::Falta confirmacion de ' + platform + ' en ' + event_id)
                      print('PUBLICACION CONFIRMADA:', event_id, platform, target['id'])
          elif status == 'partial_or_uncertain':
              raise SystemExit('::error::Publicacion parcial o incierta: revisar Meta y state.json; no reintentar a ciegas')
          else:
              raise SystemExit('::error::Estado inesperado: ' + str(status))
          print('SISMONAUTA: recibo verificado')
          PYVERIFY

      - name: Crear resumen de ejecucion
        if: always()
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
          VERIFY_RESULT: ${{ steps.monitoreo.conclusion }}
        run: |
          set -euo pipefail
          {
            echo '## SISMONAUTA | EMSC-CSEM'
            echo ''
            echo '- Activacion externa: cada 5 minutos mediante cron-job.org'
            echo '- Ciclo nominal: 10 minutos'
            echo "- Recuperacion retrospectiva: ${EMSC_RECOVERY_MINUTES} minutos"
            echo '- Magnitud: M4.0 a M6.9; radio 100 km; 15 ciudades'
            echo '- Destinos: Instagram, Facebook foto y Facebook Feed con imagen'
            echo "- Publicacion solicitada: ${PUBLISH:-sin determinar}"
            echo "- Codigo de Python: ${SCRIPT_EXIT:-no ejecutado}"
            echo "- Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo ''
          } >> "$GITHUB_STEP_SUMMARY"
          python - <<'PYSUMMARY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('output_ciudades/estado_publicacion.json')
          if not p.is_file():
              print('**Sin recibo de publicacion**')
          else:
              try:
                  data=json.loads(p.read_text(encoding='utf-8'))
                  print('**Estado final:**', data.get('status','desconocido'))
                  events=data.get('events') or []
                  print('**Eventos procesados:**',len(events))
                  for event in events:
                      print('-',event.get('id'), '| M', event.get('magnitude'), '|',event.get('city'), '|',event.get('status'))
                      for platform in ('instagram','facebook','facebook_feed'):
                          print('  -',platform+':',(event.get('targets') or {}).get(platform,{}).get('status','sin estado'))
              except (OSError, ValueError) as exc:
                  print('**Recibo ilegible:**',type(exc).__name__)
          PYSUMMARY

      - name: Diagnosticar resultados sin mostrar credenciales
        if: always()
        shell: bash
        env:
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
        run: |
          set -euo pipefail
          echo "Python: ${SCRIPT_EXIT:-sin ejecutar}"
          python - <<'PYDIAG'
          import json
          from pathlib import Path
          p=Path('output_ciudades/estado_publicacion.json')
          if not p.is_file():
              print('No se genero recibo'); raise SystemExit(0)
          try:
              data=json.loads(p.read_text(encoding='utf-8'))
          except Exception:
              print('Recibo no legible'); raise SystemExit(0)
          print('Estado:', data.get('status'), '| Ventana:', data.get('lookback_minutes'), 'min')
          for event in data.get('events') or []:
              print('Evento:',event.get('id'),'| Estado:',event.get('status'))
              for platform in ('instagram','facebook','facebook_feed'):
                  target=(event.get('targets') or {}).get(platform) or {}
                  print(platform,'|',target.get('status','sin estado'),'| ID:',target.get('id',''))
          PYDIAG

      - name: Guardar imagenes y recibos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-ciudades-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_ciudades/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
