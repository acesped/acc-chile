
name: SISMONAUTA - Alertas Ciudades EMSC

# ============================================================
# ACTIVACION
# ============================================================

on:
  # Activacion directa desde cron-job.org
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

  # Activacion externa alternativa
  repository_dispatch:
    types:
      - sismonauta-ciudades-emsc

  # Cron interno desactivado:
  # cron-job.org controla la frecuencia.
  #
  # schedule:
  #   - cron: '*/5 * * * *'

# ============================================================
# PERMISOS
# ============================================================

permissions:
  contents: write

# Evitar ejecuciones simultaneas que puedan
# duplicar publicaciones o sobrescribir estados.
concurrency:
  group: sismonauta-ciudades-emsc
  cancel-in-progress: false

# ============================================================
# TRABAJO PRINCIPAL
# ============================================================

jobs:
  monitoreo_emsc:
    name: Monitorear EMSC - Ultimas 3 horas

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg

      # GitHub
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # Instagram @sismonauta
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # Facebook SISMONAUTA
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # Meta Graph API
      META_GRAPH_VERSION: 'v25.0'
      IG_GRAPH_BASE: 'https://graph.instagram.com'

    steps:

      # ========================================
      # 1. DESCARGAR REPOSITORIO
      # ========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # ========================================
      # 2. CONFIGURAR PYTHON
      # ========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========================================
      # 3. INSTALAR DEPENDENCIAS
      # ========================================

      - name: Instalar bibliotecas
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            fonts-dejavu-core \
            libgeos-dev \
            libproj-dev

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13' \
            'matplotlib>=3.8,<4' \
            'cartopy>=0.23,<1'

          python - <<'PYDEPS'
          import requests
          import PIL
          import matplotlib
          import cartopy

          print("Requests:", requests.__version__)
          print("Pillow:", PIL.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Cartopy:", cartopy.__version__)
          print("Dependencias instaladas")
          PYDEPS

      # ========================================
      # 4. VALIDAR PYTHON
      # ========================================

      - name: Validar script SISMONAUTA
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f sismonauta_ciudades.py ]]; then
            echo "::error::Falta sismonauta_ciudades.py"
            exit 1
          fi

          python -m py_compile \
            sismonauta_ciudades.py

          echo "Script Python validado"

      # ========================================
      # 5. DETERMINAR MODO DE PUBLICACION
      # ========================================

      - name: Determinar parametros
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          EXTERNAL_PUBLISH: ${{ github.event.client_payload.publish }}
        run: |
          set -euo pipefail

          PUBLISH=false

          case "$EVENT_NAME" in

            workflow_dispatch)
              if [[ "$MANUAL_PUBLISH" == "true" ]]; then
                PUBLISH=true
              fi
              ;;

            repository_dispatch)
              if [[ "$EXTERNAL_PUBLISH" == "true" ]]; then
                PUBLISH=true
              fi
              ;;

            schedule)
              PUBLISH=true
              ;;

            *)
              echo "::error::Evento no autorizado"
              exit 1
              ;;

          esac

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "=================================="
          echo "SISMONAUTA | EMSC-CSEM"
          echo "=================================="
          echo "Evento GitHub: $EVENT_NAME"
          echo "Publicar: $PUBLISH"
          echo "Ventana EMSC: ultimas 3 horas"
          echo "Ventana EMSC: 180 minutos"
          echo "Magnitudes: M4.0 a M6.9"
          echo "Radio: 100 km"
          echo "Ciudades monitoreadas: 15"
          echo "Tsunami: no se consulta"
          echo "=================================="

      # ========================================
      # 6. VALIDAR CREDENCIALES
      # ========================================

      - name: Verificar credenciales
        if: ${{ steps.modo.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            GH_TOKEN \
            GITHUB_REPOSITORY \
            INSTAGRAM_TOKEN \
            INSTAGRAM_USER_ID \
            FACEBOOK_PAGE_ID \
            FACEBOOK_PAGE_TOKEN
          do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Falta credencial: $key"
              exit 1
            fi
          done

          echo "Credenciales disponibles"

      # ========================================
      # 7. PREPARAR DIRECTORIO
      # ========================================

      - name: Preparar directorio de salida
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output_ciudades

      # ========================================
      # 8. CONSULTAR EMSC Y PUBLICAR
      # ========================================

      - name: Monitorear EMSC y publicar
        id: monitoreo
        shell: bash
        timeout-minutes: 18
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail

          args=(
            --out output_ciudades
            --lookback-hours 3
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "=================================="
          echo "Ejecutando SISMONAUTA EMSC"
          echo "Ventana: ultimas 3 horas"
          echo "Intervalo: 180 minutos"
          echo "=================================="

          python sismonauta_ciudades.py "${args[@]}"

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Codigo Python: $CODE"

          # El siguiente paso verifica el recibo
          # y determina si la ejecucion fue correcta.
          exit 0

      # ========================================
      # 9. VERIFICAR RECIBO Y PUBLICACIONES
      # ========================================

      - name: Verificar resultados
        if: ${{ steps.monitoreo.conclusion == 'success' }}
        shell: bash
        env:
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          receipt_path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          code = int(
              os.getenv("SCRIPT_EXIT") or "1"
          )

          publish = (
              os.getenv("PUBLISH") == "true"
          )

          if not receipt_path.exists():
              raise SystemExit(
                  "::error::No existe recibo de monitoreo"
              )

          receipt = json.loads(
              receipt_path.read_text(
                  encoding="utf-8"
              )
          )

          status = receipt.get("status")
          source = receipt.get("source")
          lookback_hours = receipt.get(
              "lookback_hours"
          )
          lookback_minutes = receipt.get(
              "lookback_minutes"
          )
          events = receipt.get("events", [])

          print("Fuente:", source)
          print("Ventana:", lookback_hours, "horas")
          print("Minutos:", lookback_minutes)
          print("Estado:", status)
          print("Publicar:", publish)
          print("Codigo Python:", code)
          print("Eventos procesados:", len(events))

          # Codigo de salida del Python
          if code != 0:
              raise SystemExit(
                  "::error::El Python devolvio error"
              )

          # Fuente correcta
          if source != "EMSC-CSEM":
              raise SystemExit(
                  "::error::Fuente sismica inesperada"
              )

          # Ventana estricta de tres horas
          if lookback_hours != 3:
              raise SystemExit(
                  "::error::Ventana incorrecta: "
                  "se esperaban 3 horas"
              )

          if lookback_minutes != 180:
              raise SystemExit(
                  "::error::Ventana incorrecta: "
                  "se esperaban 180 minutos"
              )

          # Sin nuevos sismos
          if status == "no_new_event":
              if events:
                  raise SystemExit(
                      "::error::Recibo inconsistente: "
                      "no_new_event con eventos"
                  )

              print(
                  "::notice::Sin nuevos sismos "
                  "pendientes de publicacion"
              )
              raise SystemExit(0)

          # Ejecucion de prueba
          if status == "preview_only":
              if publish:
                  raise SystemExit(
                      "::error::Se esperaba publicacion real"
                  )

              print(
                  "::notice::Vista previa generada"
              )
              raise SystemExit(0)

          # Publicacion incierta
          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Publicaciones parciales "
                  "o inciertas. Revisar Meta."
              )

          # Confirmacion final
          if status != "published":
              raise SystemExit(
                  "::error::Estado inesperado: "
                  + str(status)
              )

          if not publish:
              raise SystemExit(
                  "::error::Publicacion no solicitada"
              )

          if not events:
              raise SystemExit(
                  "::error::No existen eventos confirmados"
              )

          for event in events:
              event_id = event.get("id")
              event_status = event.get("status")
              targets = event.get("targets") or {}

              if event_status not in (
                  "published",
                  "already_published",
              ):
                  raise SystemExit(
                      "::error::Evento incompleto: "
                      + str(event_id)
                  )

              for platform in (
                  "instagram",
                  "facebook",
              ):
                  target = targets.get(platform) or {}

                  if (
                      target.get("status") != "published"
                      or not str(
                          target.get("id") or ""
                      ).strip()
                  ):
                      raise SystemExit(
                          "::error::Falta confirmacion: "
                          + str(event_id)
                          + " / "
                          + platform
                      )

                  print(
                      "PUBLICACION CONFIRMADA:",
                      event_id,
                      platform,
                      target["id"],
                  )

          print(
              "SISMONAUTA: publicaciones verificadas"
          )
          PYVERIFY

      # ========================================
      # 10. CREAR RESUMEN
      # ========================================

      - name: Crear resumen de ejecucion
        if: always()
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          {
            echo "## SISMONAUTA | EMSC-CSEM"
            echo ""
            echo "- Fuente: EMSC-CSEM"
            echo "- Ventana: ultimas 3 horas"
            echo "- Duracion: 180 minutos"
            echo "- Magnitudes: M4.0 a M6.9"
            echo "- Radio: 100 km"
            echo "- Ciudades: 15"
            echo "- Publicar: ${PUBLISH:-false}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f output_ciudades/estado_publicacion.json ]]; then

            python - <<'PYSUMMARY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          print(
              "- Estado final:",
              data.get("status"),
          )

          print(
              "- Eventos procesados:",
              len(data.get("events", [])),
          )
          PYSUMMARY

          fi

      # ========================================
      # 11. CONSERVAR EVIDENCIAS
      # ========================================

      - name: Guardar imagenes y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-emsc-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_ciudades/
          if-no-files-found: warn
          retention-days: 14
