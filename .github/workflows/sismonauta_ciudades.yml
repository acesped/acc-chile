
name: SISMONAUTA - Alertas Ciudades EMSC

# ============================================================
# ACTIVACION DEL WORKFLOW
# ============================================================

on:
  # Activacion desde cron-job.org mediante GitHub API
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

      lookback_hours:
        description: 'Horas de busqueda retrospectiva en EMSC'
        required: true
        type: choice
        options:
          - '24'
          - '12'
          - '6'
          - '3'
          - '1'
        default: '24'

  # Alternativa: activacion mediante repository_dispatch
  repository_dispatch:
    types:
      - sismonauta-ciudades-emsc

  # Cron interno GitHub desactivado para evitar
  # ejecuciones duplicadas con cron-job.org.
  #
  # schedule:
  #   - cron: '*/5 * * * *'

# ============================================================
# PERMISOS
# ============================================================

permissions:
  contents: write

# Evitar monitoreos simultaneos y escrituras
# concurrentes en el historial persistente.
concurrency:
  group: sismonauta-ciudades-emsc
  cancel-in-progress: false

# ============================================================
# TRABAJO PRINCIPAL
# ============================================================

jobs:
  monitoreo_emsc:

    name: Monitorear EMSC y publicar sismos

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg

      # ========================================
      # GITHUB
      # ========================================

      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # ========================================
      # INSTAGRAM @sismonauta
      # ========================================

      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # ========================================
      # FACEBOOK SISMONAUTA
      # ========================================

      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # ========================================
      # META GRAPH API
      # ========================================

      META_GRAPH_VERSION: 'v25.0'

      IG_GRAPH_BASE: 'https://graph.instagram.com'

    steps:

      # ========================================
      # 1. DESCARGAR REPOSITORIO
      # ========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # ========================================
      # 2. CONFIGURAR PYTHON
      # ========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '.github/workflows/sismonauta_ciudades.yml'
          # El caché es opcional. Si este archivo no
          # existe todavía en main, desactiva las
          # dos líneas de caché anteriores.

      # ========================================
      # 3. INSTALAR DEPENDENCIAS
      # ========================================

      - name: Instalar bibliotecas
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            fonts-dejavu-core \
            libgeos-dev \
            libproj-dev

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13' \
            'matplotlib>=3.8,<4' \
            'cartopy>=0.23,<1'

          python - <<'PYDEPS'
          import requests
          import PIL
          import matplotlib
          import cartopy

          print("Requests:", requests.__version__)
          print("Pillow:", PIL.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Cartopy:", cartopy.__version__)
          print("Dependencias instaladas")
          PYDEPS

      # ========================================
      # 4. VALIDAR PYTHON
      # ========================================

      - name: Validar script SISMONAUTA
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f sismonauta_ciudades.py ]]; then
            echo "::error::Falta sismonauta_ciudades.py"
            exit 1
          fi

          python -m py_compile \
            sismonauta_ciudades.py

          echo "Script Python validado"

      # ========================================
      # 5. IDENTIFICAR MODO DE EJECUCION
      # ========================================

      - name: Determinar parametros
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          MANUAL_LOOKBACK: ${{ inputs.lookback_hours }}
          EXTERNAL_PUBLISH: ${{ github.event.client_payload.publish }}
          EXTERNAL_LOOKBACK: ${{ github.event.client_payload.lookback_hours }}
        run: |
          set -euo pipefail

          PUBLISH=false
          LOOKBACK=24

          case "$EVENT_NAME" in

            workflow_dispatch)
              if [[ "$MANUAL_PUBLISH" == "true" ]]; then
                PUBLISH=true
              fi

              if [[ -n "$MANUAL_LOOKBACK" ]]; then
                LOOKBACK="$MANUAL_LOOKBACK"
              fi
              ;;

            repository_dispatch)
              # Publicar por defecto en la
              # activacion externa.
              if [[ "$EXTERNAL_PUBLISH" == "false" ]]; then
                PUBLISH=false
              else
                PUBLISH=true
              fi

              if [[ -n "$EXTERNAL_LOOKBACK" ]]; then
                LOOKBACK="$EXTERNAL_LOOKBACK"
              fi
              ;;

            schedule)
              PUBLISH=true
              LOOKBACK=24
              ;;

            *)
              echo "::error::Evento no autorizado: $EVENT_NAME"
              exit 1
              ;;

          esac

          case "$LOOKBACK" in
            1|3|6|12|24)
              ;;
            *)
              echo "::error::Ventana temporal invalida"
              exit 1
              ;;
          esac

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "lookback=$LOOKBACK" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "SISMONAUTA - ALERTAS CIUDADES"
          echo "======================================"
          echo "Fuente: EMSC-CSEM"
          echo "Evento GitHub: $EVENT_NAME"
          echo "Publicar: $PUBLISH"
          echo "Ventana EMSC: $LOOKBACK horas"
          echo "Radio: 100 km"
          echo "Magnitudes: 4.0 a menos de 7.0"
          echo "Ciudades: 15"
          echo "Tsunami: no se consulta"
          echo "======================================"

      # ========================================
      # 6. VERIFICAR CREDENCIALES
      # ========================================

      - name: Verificar secretos
        if: ${{ steps.modo.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            GH_TOKEN \
            GITHUB_REPOSITORY \
            INSTAGRAM_TOKEN \
            INSTAGRAM_USER_ID \
            FACEBOOK_PAGE_ID \
            FACEBOOK_PAGE_TOKEN
          do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Falta credencial: $key"
              exit 1
            fi
          done

          echo "Credenciales disponibles"

      # ========================================
      # 7. PREPARAR DIRECTORIO DE RESULTADOS
      # ========================================

      - name: Preparar directorios
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output_ciudades

          echo "Directorio preparado"

      # ========================================
      # 8. EJECUTAR MONITOREO EMSC
      # ========================================

      - name: Monitorear EMSC y publicar
        id: monitoreo
        shell: bash
        timeout-minutes: 18
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          LOOKBACK: ${{ steps.modo.outputs.lookback }}
        run: |
          set -uo pipefail

          args=(
            --out output_ciudades
            --lookback-hours "$LOOKBACK"
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "Ejecutando SISMONAUTA EMSC"

          python sismonauta_ciudades.py "${args[@]}"

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "Codigo del programa: $CODE"

          # El paso siguiente revisa el resultado.
          exit 0

      # ========================================
      # 9. COMPROBAR RESULTADO Y PUBLICACIONES
      # ========================================

      - name: Verificar publicaciones
        if: ${{ steps.monitoreo.conclusion == 'success' }}
        shell: bash
        env:
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          receipt_path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          code = int(
              os.getenv("SCRIPT_EXIT") or "1"
          )

          publish = (
              os.getenv("PUBLISH") == "true"
          )

          if not receipt_path.exists():
              raise SystemExit(
                  "::error::No existe recibo del monitoreo"
              )

          receipt = json.loads(
              receipt_path.read_text(
                  encoding="utf-8"
              )
          )

          status = receipt.get("status")
          source = receipt.get("source")
          events = receipt.get("events", [])

          print("Fuente:", source)
          print("Estado:", status)
          print("Publicar:", publish)
          print("Codigo Python:", code)
          print("Eventos registrados:", len(events))

          if code != 0:
              raise SystemExit(
                  "::error::El script Python devolvio error"
              )

          if source != "EMSC-CSEM":
              raise SystemExit(
                  "::error::Fuente de datos inesperada"
              )

          if status == "no_new_event":
              print(
                  "::notice::Sin nuevos eventos "
                  "que publicar"
              )
              raise SystemExit(0)

          if status == "preview_only":
              if publish:
                  raise SystemExit(
                      "::error::Se esperaba publicacion real"
                  )

              print(
                  "::notice::Vista previa generada"
              )
              raise SystemExit(0)

          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Hay publicaciones inciertas "
                  "que requieren revision manual"
              )

          if status != "published":
              raise SystemExit(
                  "::error::Estado inesperado: "
                  + str(status)
              )

          if not publish:
              raise SystemExit(
                  "::error::Publicacion no solicitada"
              )

          if not events:
              raise SystemExit(
                  "::error::No hay eventos confirmados"
              )

          for event in events:
              event_id = event.get("id")
              event_status = event.get("status")
              targets = event.get("targets") or {}

              if event_status not in (
                  "published",
                  "already_published",
              ):
                  raise SystemExit(
                      "::error::Evento incompleto: "
                      + str(event_id)
                  )

              for platform in (
                  "instagram",
                  "facebook",
              ):
                  target = targets.get(platform) or {}

                  if (
                      target.get("status") != "published"
                      or not str(
                          target.get("id") or ""
                      ).strip()
                  ):
                      raise SystemExit(
                          "::error::Falta confirmacion "
                          + str(event_id)
                          + " en "
                          + platform
                      )

                  print(
                      "PUBLICACION CONFIRMADA:",
                      event_id,
                      platform,
                      target["id"],
                  )

          print(
              "SISMONAUTA: resultados verificados"
          )
          PYVERIFY

      # ========================================
      # 10. RESUMEN DE EJECUCION
      # ========================================

      - name: Crear resumen
        if: always()
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          LOOKBACK: ${{ steps.modo.outputs.lookback }}
        run: |
          {
            echo "## SISMONAUTA | EMSC-CSEM"
            echo ""
            echo "- Fuente: EMSC-CSEM"
            echo "- Magnitudes: M4.0 a M6.9"
            echo "- Radio: 100 km"
            echo "- Ciudades: 15"
            echo "- Ventana consultada: ${LOOKBACK:-24} horas"
            echo "- Publicacion: ${PUBLISH:-false}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f output_ciudades/estado_publicacion.json ]]; then
            python - <<'PYSUMMARY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          print(
              "- Estado final:",
              data.get("status"),
          )

          print(
              "- Eventos procesados:",
              len(data.get("events", [])),
          )
          PYSUMMARY
          fi

      # ========================================
      # 11. GUARDAR EVIDENCIAS
      # ========================================

      - name: Guardar imagenes y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-emsc-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_ciudades/
          if-no-files-found: warn
          retention-days: 14
