
name: SISMONAUTA - Alertas Ciudades EMSC

# ============================================================
# ACTIVACION
# ============================================================

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: true

  repository_dispatch:
    types:
      - sismonauta-ciudades-emsc

# La frecuencia de 5 minutos la gestiona cron-job.org.
# No utilizar simultaneamente schedule de GitHub.

# ============================================================
# PERMISOS
# ============================================================

permissions:
  contents: write

# Serializar ejecuciones del mismo workflow.
# GitHub Actions permite como maximo una ejecucion
# activa y una pendiente por grupo de concurrencia.
concurrency:
  group: sismonauta-ciudades-emsc
  cancel-in-progress: false

# ============================================================
# JOB PRINCIPAL
# ============================================================

jobs:
  monitoreo_emsc:

    name: Monitorear EMSC - Ultimos 10 minutos

    runs-on: ubuntu-24.04

    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg

      # GitHub
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # Instagram
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # Facebook
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # Meta
      META_GRAPH_VERSION: 'v25.0'
      IG_GRAPH_BASE: 'https://graph.instagram.com'

    steps:

      # ========================================
      # 1. DESCARGAR REPOSITORIO
      # ========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # ========================================
      # 2. CONFIGURAR PYTHON
      # ========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========================================
      # 3. INSTALAR DEPENDENCIAS
      # ========================================

      - name: Instalar dependencias
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            fonts-dejavu-core \
            libgeos-dev \
            libproj-dev

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13' \
            'matplotlib>=3.8,<4' \
            'cartopy>=0.23,<1'

          python - <<'PYDEPS'
          import requests
          import PIL
          import matplotlib
          import cartopy

          print("Requests:", requests.__version__)
          print("Pillow:", PIL.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Cartopy:", cartopy.__version__)
          print("Dependencias instaladas correctamente")
          PYDEPS

      # ========================================
      # 4. VALIDAR SCRIPT PYTHON
      # ========================================

      - name: Validar Python
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f sismonauta_ciudades.py ]]; then
            echo "::error::Falta sismonauta_ciudades.py"
            exit 1
          fi

          python -m py_compile \
            sismonauta_ciudades.py

          python sismonauta_ciudades.py --help

          echo "Script Python validado"

      # ========================================
      # 5. DETERMINAR MODO DE PUBLICACION
      # ========================================

      # Manual: publicar por defecto, permite desactivar.
      # Externo: publicar automaticamente.
      # repository_dispatch se reserva para
      # ejecuciones automaticas de publicacion.

      - name: Determinar modo
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail

          PUBLISH=false

          case "$EVENT_NAME" in

            workflow_dispatch)
              if [[ "$MANUAL_PUBLISH" == "true" ]]; then
                PUBLISH=true
              fi
              ;;

            repository_dispatch)
              PUBLISH=true
              ;;

            *)
              echo "::error::Evento no autorizado"
              exit 1
              ;;
          esac

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "=================================="
          echo "SISMONAUTA | EMSC-CSEM"
          echo "=================================="
          echo "Evento GitHub: $EVENT_NAME"
          echo "Publicar: $PUBLISH"
          echo "Fuente: EMSC-CSEM"
          echo "Ventana: 10 minutos"
          echo "Duracion: 600 segundos"
          echo "Magnitudes: M4.0 a M6.9"
          echo "Radio: 100 km"
          echo "Ciudades monitoreadas: 15"
          echo "Mapa: satelital con respaldo"
          echo "=================================="

      # ========================================
      # 6. VERIFICAR CREDENCIALES
      # ========================================

      - name: Verificar credenciales
        if: ${{ steps.modo.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            GH_TOKEN \
            GITHUB_REPOSITORY \
            GITHUB_REF_NAME \
            INSTAGRAM_TOKEN \
            INSTAGRAM_USER_ID \
            FACEBOOK_PAGE_ID \
            FACEBOOK_PAGE_TOKEN
          do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Falta credencial: $key"
              exit 1
            fi
          done

          echo "Credenciales disponibles"

      # ========================================
      # 7. PREPARAR DIRECTORIO
      # ========================================

      - name: Preparar directorio
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output_ciudades

          echo "Directorio output_ciudades preparado"

      # ========================================
      # 8. CONSULTAR EMSC Y PUBLICAR
      # ========================================

      - name: Monitorear EMSC y publicar
        id: monitoreo
        shell: bash
        timeout-minutes: 18
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail

          args=(
            --out output_ciudades
            --lookback-minutes 10
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "=================================="
          echo "SISMONAUTA - CONSULTA EMSC"
          echo "=================================="
          echo "Ventana: ultimos 10 minutos"
          echo "Duracion: 600 segundos"
          echo "Publicacion habilitada: $PUBLISH"
          echo "=================================="

          python sismonauta_ciudades.py "${args[@]}"

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "Codigo de salida Python: $CODE"

          if [[ "$CODE" -ne 0 ]]; then
            echo "::warning::El script reporto un error"
          fi

          # El paso siguiente determina si el
          # workflow debe terminar con error.
          exit 0

      # ========================================
      # 9. VERIFICAR RESULTADO
      # ========================================

      - name: Verificar recibo y publicaciones
        if: ${{ steps.monitoreo.conclusion == 'success' }}
        shell: bash
        env:
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          if not path.exists():
              raise SystemExit(
                  "::error::No existe recibo de ejecucion"
              )

          receipt = json.loads(
              path.read_text(encoding="utf-8")
          )

          status = receipt.get("status")
          source = receipt.get("source")
          hours = receipt.get("lookback_hours")
          minutes = receipt.get("lookback_minutes")
          events = receipt.get("events") or []

          code = int(
              os.getenv("SCRIPT_EXIT") or "1"
          )

          publish = (
              os.getenv("PUBLISH") == "true"
          )

          print("==================================")
          print("VERIFICACION SISMONAUTA")
          print("==================================")
          print("Fuente:", source)
          print("Estado:", status)
          print("Ventana:", minutes, "minutos")
          print("Duracion:", minutes * 60, "segundos")
          print("Publicar:", publish)
          print("Codigo Python:", code)
          print("Eventos procesados:", len(events))
          print("==================================")

          if code != 0:
              raise SystemExit(
                  "::error::Python termino con error"
              )

          if source != "EMSC-CSEM":
              raise SystemExit(
                  "::error::Fuente inesperada"
              )

          if hours != 0 or minutes != 10:
              raise SystemExit(
                  "::error::La ventana no corresponde "
                  "a los ultimos 10 minutos"
              )

          if receipt.get("publish_requested") != publish:
              raise SystemExit(
                  "::error::Modo de publicacion inconsistente"
              )

          # Sin nuevos eventos.
          if status == "no_new_event":
              if events:
                  raise SystemExit(
                      "::error::Recibo inconsistente"
                  )

              print(
                  "::notice::Sin nuevos eventos"
              )
              raise SystemExit(0)

          # Vista previa sin publicacion.
          if status == "preview_only":
              if publish:
                  raise SystemExit(
                      "::error::Se esperaba publicacion"
                  )

              print(
                  "::notice::Vista previa generada"
              )
              raise SystemExit(0)

          # Resultado parcial o incierto.
          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Publicacion parcial o incierta. "
                  "Revisar Meta y state.json antes de "
                  "reintentar."
              )

          # Se esperaba publicacion confirmada.
          if status != "published":
              raise SystemExit(
                  "::error::Estado inesperado: "
                  + str(status)
              )

          if not publish or not events:
              raise SystemExit(
                  "::error::Recibo de publicacion invalido"
              )

          # Confirmar cada plataforma.
          for event in events:

              event_id = event.get("id")
              targets = event.get("targets") or {}

              if event.get("status") not in (
                  "published",
                  "already_published",
              ):
                  raise SystemExit(
                      "::error::Evento no confirmado: "
                      + str(event_id)
                  )

              for platform in (
                  "instagram",
                  "facebook",
              ):

                  target = targets.get(platform) or {}

                  if (
                      target.get("status") != "published"
                      or not target.get("id")
                  ):
                      raise SystemExit(
                          "::error::Falta confirmacion "
                          + platform
                          + " para "
                          + str(event_id)
                      )

                  print(
                      "PUBLICACION CONFIRMADA:",
                      event_id,
                      platform,
                      target["id"],
                  )

          print("==================================")
          print("SISMONAUTA: RESULTADO VERIFICADO")
          print("==================================")
          PYVERIFY

      # ========================================
      # 10. RESUMEN DE EJECUCION
      # ========================================

      - name: Crear resumen
        if: always()
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          {
            echo "## SISMONAUTA | EMSC-CSEM"
            echo ""
            echo "- Consulta: ultimos 10 minutos"
            echo "- Duracion: 600 segundos"
            echo "- Frecuencia externa: cada 5 minutos"
            echo "- Magnitudes: M4.0 a M6.9"
            echo "- Radio: 100 km"
            echo "- Ciudades: 15"
            echo "- Imagen: satelital / respaldo"
            echo "- Publicacion habilitada: ${PUBLISH:-false}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f output_ciudades/estado_publicacion.json ]]; then

            python - <<'PYSUMMARY' >> "$GITHUB_STEP_SUMMARY" || true
          import json
          from pathlib import Path

          path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          try:
              data = json.loads(
                  path.read_text(encoding="utf-8")
              )

              print(
                  "- Estado final:",
                  data.get("status"),
              )

              events = data.get("events") or []

              print(
                  "- Eventos procesados:",
                  len(events),
              )

              print("")

              for event in events:

                  print(
                      "- Evento:",
                      event.get("id"),
                      "| Magnitud:",
                      event.get("magnitude"),
                      "| Ciudad:",
                      event.get("city"),
                      "| Estado:",
                      event.get("status"),
                  )

                  targets = event.get("targets") or {}

                  for platform in (
                      "instagram",
                      "facebook",
                  ):

                      target = targets.get(platform) or {}

                      print(
                          "  -",
                          platform,
                          ":",
                          target.get("status", "sin estado"),
                      )

          except Exception as exc:
              print(
                  "- Error al generar resumen:",
                  str(exc)[:200],
              )
          PYSUMMARY

          else

            echo "- No se genero recibo de ejecucion" \
              >> "$GITHUB_STEP_SUMMARY"

          fi

      # ========================================
      # 11. DIAGNOSTICO DE PUBLICACION
      # ========================================

      - name: Diagnosticar publicacion SISMONAUTA
        if: always()
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
        run: |
          set -euo pipefail

          echo "=================================="
          echo "DIAGNOSTICO SISMONAUTA"
          echo "=================================="

          echo "Modo publicar: ${PUBLISH:-no determinado}"
          echo "Codigo Python: ${SCRIPT_EXIT:-no disponible}"

          python - <<'PYDIAG'
          import json
          from pathlib import Path

          path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          if not path.exists():
              print("ERROR: Recibo no generado")
              raise SystemExit(0)

          try:
              receipt = json.loads(
                  path.read_text(encoding="utf-8")
              )
          except Exception as exc:
              print("ERROR leyendo recibo:", str(exc))
              raise SystemExit(0)

          print("Estado general:", receipt.get("status"))
          print("Error general:", receipt.get("error", "Ninguno"))
          print("Ventana:", receipt.get("lookback_minutes"), "min")

          events = receipt.get("events", [])

          for event in events:
              print("--------------------------------")
              print("Evento:", event.get("id"))
              print("Estado:", event.get("status"))

              for platform, data in (
                  event.get("targets") or {}
              ).items():
                  print("Plataforma:", platform)
                  print("Estado:", data.get("status"))
                  print("ID publicado:", data.get("id"))
                  print("Error:", data.get("error"))

          if not events:
              print("No hay eventos en el recibo")

          print("==================================")
          PYDIAG

      # ========================================
      # 12. GUARDAR EVIDENCIAS
      # ========================================

      - name: Guardar imagenes y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-resultados
          path: output_ciudades/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
