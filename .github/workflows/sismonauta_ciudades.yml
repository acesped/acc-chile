
name: SISMONAUTA - Alertas Ciudades EMSC

# ============================================================
# ACTIVACION
# ============================================================

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

  repository_dispatch:
    types:
      - sismonauta-ciudades-emsc

# ============================================================
# PERMISOS Y CONCURRENCIA
# ============================================================

permissions:
  contents: write

concurrency:
  group: sismonauta-ciudades-emsc
  cancel-in-progress: false

# ============================================================
# JOB
# ============================================================

jobs:
  monitoreo_emsc:
    name: Monitorear EMSC - Ultimas 3 horas

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      MPLBACKEND: Agg

      # GitHub
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # Instagram
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # Facebook
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # Meta
      META_GRAPH_VERSION: 'v25.0'
      IG_GRAPH_BASE: 'https://graph.instagram.com'

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # ========================================
      # 2. PYTHON
      # ========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========================================
      # 3. DEPENDENCIAS
      # ========================================

      - name: Instalar dependencias
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail

          sudo apt-get update -qq

          sudo apt-get install -y -qq \
            fonts-dejavu-core \
            libgeos-dev \
            libproj-dev

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13' \
            'matplotlib>=3.8,<4' \
            'cartopy>=0.23,<1'

          python - <<'PYDEPS'
          import requests
          import PIL
          import matplotlib
          import cartopy

          print("Requests:", requests.__version__)
          print("Pillow:", PIL.__version__)
          print("Matplotlib:", matplotlib.__version__)
          print("Cartopy:", cartopy.__version__)
          PYDEPS

      # ========================================
      # 4. VALIDAR PYTHON
      # ========================================

      - name: Validar script
        shell: bash
        run: |
          set -euo pipefail

          test -f sismonauta_ciudades.py

          python -m py_compile \
            sismonauta_ciudades.py

          echo "Python validado"

      # ========================================
      # 5. MODO DE PUBLICACION
      # ========================================

      - name: Determinar modo
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          EXTERNAL_PUBLISH: ${{ github.event.client_payload.publish }}
        run: |
          set -euo pipefail

          PUBLISH=false

          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ "$MANUAL_PUBLISH" == "true" ]]; then
                PUBLISH=true
              fi
              ;;

            repository_dispatch)
              if [[ "$EXTERNAL_PUBLISH" == "true" ]]; then
                PUBLISH=true
              fi
              ;;

            *)
              echo "::error::Evento no autorizado"
              exit 1
              ;;
          esac

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "=================================="
          echo "SISMONAUTA EMSC"
          echo "Publicar: $PUBLISH"
          echo "Ventana: 180 minutos"
          echo "Magnitudes: M4.0 a M6.9"
          echo "Radio: 100 km"
          echo "Ciudades: 15"
          echo "Mapa: satelital con respaldo"
          echo "=================================="

      # ========================================
      # 6. VALIDAR SECRETOS
      # ========================================

      - name: Verificar credenciales
        if: ${{ steps.modo.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for key in \
            GH_TOKEN \
            GITHUB_REPOSITORY \
            INSTAGRAM_TOKEN \
            INSTAGRAM_USER_ID \
            FACEBOOK_PAGE_ID \
            FACEBOOK_PAGE_TOKEN
          do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Falta credencial: $key"
              exit 1
            fi
          done

          echo "Credenciales disponibles"

      # ========================================
      # 7. PREPARAR CARPETA
      # ========================================

      - name: Preparar salida
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output_ciudades

      # ========================================
      # 8. EJECUTAR PYTHON
      # ========================================

      - name: Monitorear EMSC y publicar
        id: monitoreo
        shell: bash
        timeout-minutes: 18
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail

          args=(
            --out output_ciudades
            --lookback-hours 3
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          echo "Ejecutando SISMONAUTA"
          echo "Fuente: EMSC-CSEM"
          echo "Muestreo: ultimas 3 horas"

          python sismonauta_ciudades.py "${args[@]}"

          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          echo "Codigo de salida: $CODE"

          # La verificacion posterior revisa
          # el recibo y el resultado.
          exit 0

      # ========================================
      # 9. VERIFICAR RECIBO
      # ========================================

      - name: Verificar resultado
        if: ${{ steps.monitoreo.conclusion == 'success' }}
        shell: bash
        env:
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          if not path.exists():
              raise SystemExit(
                  "::error::Falta el recibo"
              )

          receipt = json.loads(
              path.read_text(encoding="utf-8")
          )

          status = receipt.get("status")
          source = receipt.get("source")
          hours = receipt.get("lookback_hours")
          minutes = receipt.get("lookback_minutes")
          events = receipt.get("events") or []

          code = int(
              os.getenv("SCRIPT_EXIT") or "1"
          )

          publish = (
              os.getenv("PUBLISH") == "true"
          )

          print("Fuente:", source)
          print("Estado:", status)
          print("Ventana:", hours, "horas")
          print("Minutos:", minutes)
          print("Publicar:", publish)
          print("Codigo Python:", code)
          print("Eventos:", len(events))

          if code != 0:
              raise SystemExit(
                  "::error::Python terminó con error"
              )

          if source != "EMSC-CSEM":
              raise SystemExit(
                  "::error::Fuente inesperada"
              )

          if hours != 3 or minutes != 180:
              raise SystemExit(
                  "::error::La ventana no es de 3 horas"
              )

          if status == "no_new_event":
              if events:
                  raise SystemExit(
                      "::error::Recibo inconsistente"
                  )

              print(
                  "::notice::No hay eventos pendientes"
              )
              raise SystemExit(0)

          if status == "preview_only":
              if publish:
                  raise SystemExit(
                      "::error::Se esperaba publicación"
                  )

              print(
                  "::notice::Vista previa generada"
              )
              raise SystemExit(0)

          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Revisar publicaciones inciertas"
              )

          if status != "published":
              raise SystemExit(
                  "::error::Estado inesperado: "
                  + str(status)
              )

          if not publish or not events:
              raise SystemExit(
                  "::error::Recibo de publicación inválido"
              )

          for event in events:
              event_id = event.get("id")
              targets = event.get("targets") or {}

              if event.get("status") not in (
                  "published",
                  "already_published",
              ):
                  raise SystemExit(
                      "::error::Evento no publicado: "
                      + str(event_id)
                  )

              for platform in (
                  "instagram",
                  "facebook",
              ):
                  target = targets.get(platform) or {}

                  if (
                      target.get("status") != "published"
                      or not target.get("id")
                  ):
                      raise SystemExit(
                          "::error::Sin confirmacion en "
                          + platform
                          + ": "
                          + str(event_id)
                      )

                  print(
                      "CONFIRMADO:",
                      event_id,
                      platform,
                      target["id"],
                  )

          print(
              "SISMONAUTA: publicaciones verificadas"
          )
          PYVERIFY

      # ========================================
      # 10. RESUMEN
      # ========================================

      - name: Resumen de ejecución
        if: always()
        shell: bash
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          {
            echo "## SISMONAUTA | EMSC-CSEM"
            echo ""
            echo "- Muestreo: ultimas 3 horas"
            echo "- Frecuencia externa: cada 5 minutos"
            echo "- Magnitudes: M4.0 a M6.9"
            echo "- Radio: 100 km"
            echo "- Ciudades: 15"
            echo "- Imagen: mapa satelital / respaldo"
            echo "- Publicar: ${PUBLISH:-false}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -f output_ciudades/estado_publicacion.json ]]; then
            python - <<'PYSUMMARY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path(
              "output_ciudades/estado_publicacion.json"
          )

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          print(
              "- Estado final:",
              data.get("status"),
          )

          print(
              "- Eventos procesados:",
              len(data.get("events", [])),
          )
          PYSUMMARY
          fi

      # ========================================
      # 11. ARTEFACTOS
      # ========================================

      - name: Guardar imágenes y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-emsc-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_ciudades/
          if-no-files-found: warn
          retention-days: 14
