
name: GroundShake - Monitor horario y refresh semanal de Instagram

on:
  workflow_dispatch:
    inputs:
      forzar_renovacion:
        description: 'Solicitar refresh aun sin cumplir siete dias (requiere token vigente)'
        required: false
        type: boolean
        default: false
      solo_verificar:
        description: 'Verificar sin renovar'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

# Usar el mismo grupo en el workflow
# de publicación de GroundShake.
concurrency:
  group: csn-acceleration-publisher
  cancel-in-progress: false

jobs:
  monitor-token:
    runs-on: ubuntu-24.04
    timeout-minutes: 6

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --disable-pip-version-check \
            'requests>=2.31,<3' \
            'PyNaCl>=1.5,<2'

      - name: Comprobar identidad y renovar solo si corresponde
        env:
          IG_LOGIN_TYPE: instagram
          IG_EXPECTED_USERNAME: groundshake_cl
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE_REFRESH: ${{ inputs.forzar_renovacion || false }}
          CHECK_ONLY: ${{ inputs.solo_verificar || false }}

        shell: bash
        run: |
          set -euo pipefail

          args=()

          if [[ "$FORCE_REFRESH" == 'true' ]]; then
            args+=(--force-refresh)
          fi

          if [[ "$CHECK_ONLY" == 'true' ]]; then
            args+=(--check-only)
          fi

          python scripts/refresh_instagram_token.py "${args[@]}"
