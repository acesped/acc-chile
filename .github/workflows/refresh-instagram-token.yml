name: Groundshake - verificar y renovar token Instagram

on:
  workflow_dispatch:
    inputs:
      solo_verificar:
        description: 'Validar sin renovar'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '17 9 * * *' # Cada día 09:17 UTC; Meta puede retrasar scheduled workflows

permissions:
  contents: read

concurrency:
  group: csn-acceleration-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: python -m pip install 'requests>=2.32,<3' 'PyNaCl>=1.5,<2'
      - name: Verificar y renovar si corresponde
        env:
          IG_LOGIN_TYPE: instagram
          IG_GRAPH_VERSION: v25.0
          IG_REFRESH_ENABLED: ${{ github.event_name != 'workflow_dispatch' || inputs.solo_verificar != true }}
          IG_EXPECTED_USERNAME: groundshake_cl
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python scripts/refresh_instagram_token.py
