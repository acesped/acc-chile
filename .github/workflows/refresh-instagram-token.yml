
name: SISMONAUTA - Monitor diario y renovacion preventiva Instagram

# Comprobacion diaria; el Python decide si han transcurrido 7 dias.
# No soluciona revocaciones de Meta (OAuth 190).
on:
  workflow_dispatch:
    inputs:
      forzar_renovacion:
        description: 'Solicitar renovacion antes de 7 dias (solo token valido y elegible)'
        type: boolean
        required: false
        default: false
      solo_verificar:
        description: 'Comprobar identidad y validez, sin modificar Secrets'
        type: boolean
        required: false
        default: false
  schedule:
    - cron: '13 9 * * *'

permissions:
  contents: read

# Grupo propio de @sismonauta. Usar el mismo grupo en
# cualquier otro workflow que modifique este mismo secreto.
concurrency:
  group: sismonauta-instagram-token-refresh
  cancel-in-progress: false

jobs:
  monitor-token:
    name: Comprobar y renovar token de @sismonauta
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    env:
      PYTHONUNBUFFERED: '1'
      IG_LOGIN_TYPE: instagram
      IG_EXPECTED_USERNAME: sismonauta
      GITHUB_REPOSITORY: ${{ github.repository }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
      FORCE_REFRESH: ${{ inputs.forzar_renovacion || false }}
      CHECK_ONLY: ${{ inputs.solo_verificar || false }}

    steps:
      # ==========================================
      # 1. IDENTIFICAR EJECUCION
      # ==========================================

      - name: Identificar ejecucion
        shell: bash
        run: |
          set -euo pipefail

          echo 'SISMONAUTA | Monitor del token Instagram'
          echo "Repositorio: $GITHUB_REPOSITORY"
          echo "Evento: $GITHUB_EVENT_NAME"
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "Comprobacion sin escritura: $CHECK_ONLY"
          echo "Forzar renovacion: $FORCE_REFRESH"

          if [[ "$CHECK_ONLY" == 'true' && "$FORCE_REFRESH" == 'true' ]]; then
            echo '::warning::Ambas opciones activadas: prevalece solo_verificar; no se renovara ni escribira el secreto.'
            echo 'FORCE_REFRESH=false' >> "$GITHUB_ENV"
          fi

      # ==========================================
      # 2. DESCARGAR REPOSITORIO
      # ==========================================

      - name: Descargar codigo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # ==========================================
      # 3. CONFIGURAR PYTHON
      # ==========================================

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ==========================================
      # 4. INSTALAR DEPENDENCIAS
      # ==========================================

      - name: Instalar dependencias
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail

          python -m pip install --disable-pip-version-check --retries 3 \
            'requests>=2.31,<3' \
            'PyNaCl>=1.5,<2'

      # ==========================================
      # 5. VALIDAR SCRIPT Y SECRETOS
      # ==========================================

      - name: Verificar script y secretos
        shell: bash
        run: |
          set -euo pipefail

          test -f scripts/refresh_instagram_token.py || {
            echo '::error::Falta scripts/refresh_instagram_token.py'
            exit 1
          }

          python -m py_compile scripts/refresh_instagram_token.py

          if [[ "$GITHUB_REPOSITORY" != 'acesped/acc-chile' ]]; then
            echo '::error::Repositorio no autorizado para este renovador'
            exit 1
          fi

          for name in INSTAGRAM_TOKEN INSTAGRAM_USER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta GitHub Secret: $name"
              exit 1
            fi
          done

          if [[ ! "$INSTAGRAM_USER_ID" =~ ^[0-9]+$ ]]; then
            echo '::error::INSTAGRAM_USER_ID debe ser numerico'
            exit 1
          fi

          if [[ "$CHECK_ONLY" != 'true' && -z "${GH_SECRETS_TOKEN:-}" ]]; then
            echo '::error::Falta GH_SECRETS_TOKEN para actualizar Instagram Secret'
            exit 1
          fi

          # El valor del token nunca se imprime.
          echo 'Script y configuracion basica verificados'

          python - <<'PY'
          from pathlib import Path

          source = Path(
              'scripts/refresh_instagram_token.py'
          ).read_text(encoding='utf-8')

          if (
              "SECRET_NAME = 'INSTAGRAM_TOKEN'" not in source
              or "username != 'sismonauta'" not in source
              or "need('INSTAGRAM_USER_ID')" not in source
          ):
              raise SystemExit(
                  '::error::Instala el renovador Python '
                  'especifico de @sismonauta y INSTAGRAM_TOKEN'
              )
          PY

      # ==========================================
      # 6. VERIFICAR PERMISOS GITHUB SECRETS
      # ==========================================

      - name: Verificar permiso de GitHub Secrets
        if: ${{ inputs.solo_verificar != true }}
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          import requests

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_SECRETS_TOKEN']

          headers = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          for path in (
              '/actions/secrets/INSTAGRAM_TOKEN',
              '/actions/secrets/public-key',
          ):
              url = f'https://api.github.com/repos/{repo}{path}'

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=20
                  )
              except requests.RequestException as exc:
                  raise SystemExit(
                      '::error::GitHub Secrets: fallo de conexion ('
                      + type(exc).__name__ + ')'
                  )

              if response.status_code != 200:
                  raise SystemExit(
                      f'::error::GitHub Secrets: GET {path} '
                      f'devolvio HTTP {response.status_code}. '
                      'Revisar permisos Secrets Read/Write '
                      'y acceso al repositorio.'
                  )

          print(
              'GitHub Secrets: lectura de metadata '
              'y clave publica confirmadas'
          )
          print(
              'Nota: el permiso de escritura se comprueba '
              'al guardar el token nuevo'
          )
          PY

      # ==========================================
      # 7. VERIFICAR Y RENOVAR TOKEN
      # ==========================================

      - name: Verificar identidad y renovar cuando corresponda
        id: refresh
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail

          args=()

          if [[ "$CHECK_ONLY" == 'true' ]]; then
            args+=(--check-only)
          elif [[ "$FORCE_REFRESH" == 'true' ]]; then
            args+=(--force-refresh)
          fi

          # Mantener el codigo de salida del script
          # sin imprimir credenciales.
          python scripts/refresh_instagram_token.py "${args[@]}"

          echo 'Comprobacion de Meta finalizada correctamente'

      # ==========================================
      # 8. RESUMEN DE EJECUCION
      # ==========================================

      - name: Resumen y accion correctiva
        if: always()
        shell: bash
        env:
          REFRESH_RESULT: ${{ steps.refresh.outcome }}
        run: |
          set -euo pipefail

          {
            echo '## SISMONAUTA - Token de Instagram'
            echo ''
            echo '- Cuenta esperada: @sismonauta'
            echo "- Fecha UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "- Comprobacion solamente: ${CHECK_ONLY:-false}"
            echo "- Renovacion forzada: ${FORCE_REFRESH:-false}"
            echo "- Resultado del paso: ${REFRESH_RESULT:-no ejecutado}"
            echo ''

            if [[ "$REFRESH_RESULT" != 'success' ]]; then
              echo '### Accion requerida'
              echo 'Comprobar el error del paso de renovacion.'
              echo 'Si Meta informa OAuth 190, se requiere'
              echo 'reautorizar @sismonauta.'
              echo 'El refresh no recupera tokens revocados.'
              echo ''
              echo 'Si GitHub deniega la escritura, revisar'
              echo 'el permiso Secrets: Read and write'
              echo 'de GH_SECRETS_TOKEN.'
              echo ''
              echo '> Nunca incluir tokens en logs, artefactos o commits.'
            else
              echo 'Comprobacion exitosa.'
              echo 'El paso de Python indica si correspondia renovar.'
              echo 'El monitor no afirma que hubo renovacion'
              echo 'cuando solo se verifico la cuenta.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
