name: Renovar token de Instagram

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 1 * *' # día 1 de cada mes, 09:17 UTC

permissions:
  contents: read

# Evita que el monitor lea un token que está siendo actualizado.
concurrency:
  group: csn-acceleration-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install 'requests>=2.32,<3' 'PyNaCl>=1.5,<2'

      - name: Renovar token y actualizar GitHub Secrets
        env:
          IG_LOGIN_TYPE: instagram
          IG_EXPECTED_USERNAME: groundshake_cl
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: python scripts/refresh_instagram_token.py
