name: SISMONAUTA - Efemerides sismicas

on:
  schedule:
    # 13:15 UTC; la fecha efectiva se calcula en America/Santiago.
    # GitHub puede retrasar la ejecución cron.
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook (false = vista previa)'
        type: boolean
        default: false
      date:
        description: 'Fecha YYYY-MM-DD; vacío utiliza el día actual en Chile'
        required: false
        type: string
      min_magnitude:
        description: 'Magnitud mínima (por defecto 8.0)'
        required: false
        default: '8.0'
        type: string

permissions:
  contents: read

concurrency:
  group: sismonauta-efemerides
  cancel-in-progress: false

jobs:
  efemeride:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      IG_GRAPH_VERSION: v25.0
      EFEMERIDES_TIMEZONE: America/Santiago

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install --disable-pip-version-check requests pillow

      - name: Pruebas de datos y formato
        run: python efemerides_sismonauta.py --test

      - name: Generar y publicar efemeride
        shell: bash
        env:
          INPUT_DATE: ${{ inputs.date || '' }}
          INPUT_MIN_MAG: ${{ inputs.min_magnitude || '8.0' }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
        run: |
          args=(--out output_efemerides --min-mag "$INPUT_MIN_MAG")
          if [[ -n "$INPUT_DATE" ]]; then args+=(--date "$INPUT_DATE"); fi
          if [[ "${{ github.event_name }}" == "schedule" || "$INPUT_PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi
          python efemerides_sismonauta.py "${args[@]}"

      - name: Guardar salida y auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-efemerides-${{ github.run_number }}
          path: |
            output_efemerides/*.jpg
            output_efemerides/*.json
          if-no-files-found: ignore
          retention-days: 14
