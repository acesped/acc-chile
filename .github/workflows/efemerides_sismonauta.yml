name: SISMONAUTA - Efemerides sismicas (cron)

on:
  schedule:
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        type: boolean
        required: false
        default: false
      date:
        description: 'Fecha YYYY-MM-DD; vacio = hoy en Chile'
        type: string
        required: false
        default: ''
      min_magnitude:
        description: 'Magnitud minima'
        type: string
        required: false
        default: '8.0'

permissions:
  contents: write

concurrency:
  group: sismonauta-efemerides
  cancel-in-progress: false

jobs:
  publicar-efemeride:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Usar token nativo: disponible automaticamente para el repositorio.
      # NO utilizar secrets.GH_TOKEN cuando ese secreto este vacio.
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      EFEMERIDES_TIMEZONE: America/Santiago
      IG_GRAPH_VERSION: v25.0

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: python -m pip install --disable-pip-version-check requests pillow

      - name: Pruebas del filtro historico
        run: python efemerides_sismonauta.py --test

      - name: Verificar autorizacion GitHub
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'ERROR: GitHub Actions no proporciono token de acceso.' >&2
            exit 1
          fi
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}")"
          if [[ "$status" != "200" ]]; then
            echo "ERROR: autenticacion GitHub HTTP ${status}. Revisar permisos contents: write y configuracion de Actions." >&2
            exit 1
          fi
          echo 'Acceso autenticado al repositorio: OK'

      - name: Buscar efemeride y publicar si corresponde
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DATE: ${{ inputs.date || '' }}
          INPUT_MAG: ${{ inputs.min_magnitude || '8.0' }}
          INPUT_PUBLISH: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail
          args=(--out output_efemerides --min-mag "$INPUT_MAG")
          if [[ -n "$INPUT_DATE" ]]; then
            args+=(--date "$INPUT_DATE")
          fi
          if [[ "$EVENT_NAME" == "schedule" || "$INPUT_PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi
          python efemerides_sismonauta.py "${args[@]}"

      - name: Guardar imagenes y auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efemerides-${{ github.run_number }}
          path: |
            output_efemerides/*.jpg
            output_efemerides/*.json
          if-no-files-found: ignore
          retention-days: 14
