name: SISMONAUTA - Videos cientificos

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram, Facebook y YouTube (false = solo previsualizar)'
        required: true
        type: boolean
        default: true
      story:
        description: 'Publicar tambien Stories de Instagram y Facebook'
        required: true
        type: boolean
        default: true
  # Activa esta programación cuando OAuth y las subidas se hayan probado.
  # schedule:
  #   - cron: '0 15 * * *'

permissions:
  contents: write

concurrency:
  group: sismonauta-monitor-publicacion
  cancel-in-progress: false

jobs:
  crear-y-publicar:
    name: Crear video y publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
      YT_PRIVACY: private
      IG_EXPECTED_USERNAME: sismonauta
      FACEBOOK_EXPECTED_USERNAME: sismonauta
      DV_VOICE: es-CL-CatalinaNeural
      DISCOVERY_USE_AI: 'true'
      ENABLE_OPENVERSE: 'true'
      DISCOVERY_MAX_ATTEMPTS: '15'

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar FFmpeg y fuentes
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core fonts-liberation
          ffmpeg -version | head -n 1

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow edge-tts mutagen imageio-ffmpeg

      - name: Verificar sintaxis y descubrimiento
        run: |
          python -m py_compile monitor.py
          python monitor.py --test-discovery

      - name: Comprobar credenciales para publicar
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        shell: bash
        run: |
          set -euo pipefail
          for name in INSTAGRAM_TOKEN INSTAGRAM_USER_ID FACEBOOK_PAGE_ID FACEBOOK_PAGE_TOKEN GH_TOKEN YT_CLIENT_ID YT_CLIENT_SECRET YT_REFRESH_TOKEN YT_CHANNEL_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta el secreto/valor $name"
              exit 1
            fi
          done

      - name: Verificar OAuth y canal de YouTube
        if: ${{ github.event_name == 'schedule' || inputs.publish == true }}
        run: |
          python - <<'PY'
          import monitor
          token = monitor.yt_token()
          monitor.yt_verify_channel(token)
          print('YouTube OAuth y canal verificados; privacidad solicitada:', monitor.yt_privacy())
          PY

      - name: Generar y publicar (o previsualizar)
        env:
          SHOULD_PUBLISH: ${{ github.event_name == 'schedule' || inputs.publish == true }}
          SHOULD_STORY: ${{ github.event_name == 'schedule' || inputs.story == true }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--out output_sismos)
          if [[ "$SHOULD_PUBLISH" == 'true' ]]; then
            args+=(--publish --auto-publish)
          fi
          if [[ "$SHOULD_STORY" == 'true' ]]; then
            args+=(--story)
          fi
          python monitor.py "${args[@]}"

      - name: Guardar video, storyboard y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-${{ github.run_id }}
          path: output_sismos/
          if-no-files-found: ignore
          retention-days: 7
