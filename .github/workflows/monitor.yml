name: CSN acceleration video to X

on:
  schedule:
    - cron: '*/10 * * * *'

  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en X (false = simulación sin X)'
        type: boolean
        default: false

      initialize_state:
        description: 'Sólo primer uso: crear estado del modo elegido si no existe'
        type: boolean
        default: false

      reconcile:
        description: 'Intentar confirmar envíos inciertos mediante timeline (requiere lectura)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: csn-acceleration-publisher
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'

      MAG_MIN: '4.0'
      MAX_STATIONS: "15"
      MAX_CANDIDATES: "30"
      LOOKBACK_HOURS: '72'
      PRE_SEG: '60'
      POST_SEG: '120'
      MARGEN_SEG: '30'
      DATA_LATENCY_SEC: '180'

      FPS: '4'
      FRAME_STEP_SEC: '1'

      DOWNLOAD_WORKERS: '4'
      HTTP_TIMEOUT: '30'

      MAX_EVENTS_PER_RUN: '2'
      MAX_RUNTIME_SEC: '2100'
      EVENT_TIMEOUT_SEC: '800'
      X_PROCESS_TIMEOUT_SEC: '900'

      STATE_DIR: .state
      STATE_BRANCH: monitor-state
      OUTPUT_DIR: output

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Dependencias
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
          npm install --no-save --package-lock=false twitter-text@3.1.0

      - name: Pruebas sin red ni publicaciones
        run: python -m pytest -q test_monitor.py

      - name: Ejecutar un ciclo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          PUBLISH_TO_X: ${{ github.event_name == 'schedule' || inputs.publish }}
          INIT_STATE: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_state }}
          RECONCILE_X: ${{ github.event_name == 'workflow_dispatch' && inputs.reconcile }}

          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

        run: |
          if [ "$INIT_STATE" = "true" ]; then
            python monitor.py --init-state
          else
            python monitor.py
          fi

      - name: Diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: csn-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: ignore
          retention-days: 5
