name: GROUNDSHAKE CL - Reels sismicos sincronizados

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'ID de tema opcional; vacio = seleccion automatica'
        required: false
        default: ''
        type: string
      publish:
        description: 'Publicar el Reel automaticamente'
        required: true
        default: true
        type: boolean
      story:
        description: 'Publicar tambien Story'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: groundshake-cl-instagram
  cancel-in-progress: false

jobs:
  generar-y-publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: '1'
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      IG_GRAPH_VERSION: 'v25.0'
      IG_EXPECTED_USERNAME: 'groundshake_cl'
      GH_TOKEN: ${{ github.token }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}
      DV_VOICE: 'es-CL-CatalinaNeural'
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias y FFmpeg sin APT
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --retries 3 --timeout 45 \
            'Pillow>=10,<13' 'requests>=2.31,<3' 'edge-tts>=6,<8' \
            'mutagen>=1.47,<2' 'imageio-ffmpeg>=0.6,<1'
          mkdir -p "$RUNNER_TEMP/groundshake-bin"
          FFMPEG_BIN="$(python - <<'PY'
          import imageio_ffmpeg
          print(imageio_ffmpeg.get_ffmpeg_exe())
          PY
          )"
          ln -sf "$FFMPEG_BIN" "$RUNNER_TEMP/groundshake-bin/ffmpeg"
          echo "$RUNNER_TEMP/groundshake-bin" >> "$GITHUB_PATH"
          "$FFMPEG_BIN" -hide_banner -version | head -n 1

      - name: Verificar programa y FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          test -f monitor.py || { echo '::error::Falta monitor.py en la raiz'; exit 1; }
          python -m py_compile monitor.py
          command -v ffmpeg >/dev/null || { echo '::error::Falta FFmpeg'; exit 1; }
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/encoders.txt" 2>&1
          grep -q 'libx264' "$RUNNER_TEMP/encoders.txt" || { echo '::error::Falta libx264'; exit 1; }
          echo 'monitor.py y FFmpeg listos.'

      - name: Comprobar secretos necesarios
        if: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${INSTAGRAM_TOKEN:-}" && -n "${INSTAGRAM_USER_ID:-}" ]] || {
            echo '::error::Faltan secretos INSTAGRAM_TOKEN o INSTAGRAM_USER_ID'; exit 1;
          }
          [[ "$INSTAGRAM_USER_ID" =~ ^[0-9]+$ ]] || {
            echo '::error::INSTAGRAM_USER_ID debe ser numerico'; exit 1;
          }
          echo 'Secretos presentes. monitor.py verificara el token y el usuario ante Meta.'

      - name: Crear Reel y publicar automaticamente
        shell: bash
        timeout-minutes: 32
        env:
          PUBLISH: ${{ inputs.publish && 'true' || 'false' }}
          STORY: ${{ inputs.story && 'true' || 'false' }}
          TOPIC: ${{ inputs.topic }}
        run: |
          set -euo pipefail
          args=(--out output_sismos)
          if [[ -n "$TOPIC" ]]; then args+=(--topic "$TOPIC"); fi
          if [[ "$PUBLISH" == 'true' ]]; then
            args+=(--publish --auto-publish)
            if [[ "$STORY" == 'true' ]]; then args+=(--story); fi
          fi
          echo "Cuenta de destino: @groundshake_cl | publicacion=$PUBLISH | story=$STORY"
          echo "Video con voz individual, rotulo y foto por escena"
          python monitor.py "${args[@]}"

      - name: Confirmar publicacion efectiva con identificador Meta
        if: ${{ inputs.publish }}
        shell: bash
        env:
          REQUIRE_STORY: ${{ inputs.story && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json
          from pathlib import Path
          receipt = Path('output_sismos/publicacion_confirmada.json')
          if not receipt.exists():
              raise SystemExit('::error::No existe recibo de Meta; el workflow no puede declararse publicado')
          data = json.loads(receipt.read_text(encoding='utf-8'))
          if data.get('account') != 'groundshake_cl' or not data.get('reel_published') or not str(data.get('reel_id') or '').isdigit():
              raise SystemExit('::error::Recibo Reel invalido; no se confirma publicacion')
          import os
          if os.environ.get('REQUIRE_STORY') == 'true' and (not data.get('story_published') or not str(data.get('story_id') or '').isdigit()):
              raise SystemExit('::error::Reel confirmado, pero Story no confirmada; revisar en Instagram antes de reintentar')
          print('PUBLICACION CONFIRMADA @groundshake_cl: Reel ID', data['reel_id'])
          if data.get('story_published'):
              print('STORY CONFIRMADA: ID', data['story_id'])
          PYCODE

      - name: Guardar videos guiones e imagenes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groundshake-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output_sismos/**/*.json
            output_sismos/**/*.mp4
            output_sismos/**/*.jpg
            output_sismos/**/*.png
            output_sismos/*.json
            output_sismos/*.mp4
            output_sismos/*.jpg
            output_sismos/*.png
          if-no-files-found: warn
          retention-days: 14
