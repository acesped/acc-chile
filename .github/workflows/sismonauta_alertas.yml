
name: SISMONAUTA - Alertas mundiales M7+

on:
  # Activacion desde cron-job.org u otro servicio HTTP
  repository_dispatch:
    types:
      - sismonauta-alertas-m7

  # Ejecucion manual desde GitHub Actions
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publicar en Instagram y Facebook'
        required: true
        type: boolean
        default: false

  # Cron interno opcional.
  # Descomentarlo solo si tambien deseas la
  # programacion automatica de GitHub.
  # schedule:
  #   - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: sismonauta-alertas-m7
  cancel-in-progress: false

jobs:
  alerta_m7:
    name: Monitorear y publicar terremotos M7+
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      PYTHONUNBUFFERED: '1'

      # GitHub
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_REF_NAME: ${{ github.event.repository.default_branch }}

      # Instagram SISMONAUTA
      INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}

      # Facebook SISMONAUTA
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

      # API Meta
      IG_GRAPH_VERSION: 'v25.0'

    steps:
      # ========================================
      # 1. DESCARGAR REPOSITORIO
      # ========================================

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      # ========================================
      # 2. PREPARAR PYTHON
      # ========================================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ========================================
      # 3. INSTALAR DEPENDENCIAS
      # ========================================

      - name: Instalar librerias
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail

          python -m pip install \
            --disable-pip-version-check \
            --retries 3 \
            --timeout 45 \
            'requests>=2.31,<3' \
            'Pillow>=10,<13' \
            'matplotlib>=3.8,<4' \
            'cartopy>=0.23,<1'

      # ========================================
      # 4. VALIDAR SCRIPT
      # ========================================

      - name: Validar Python
        shell: bash
        run: |
          set -euo pipefail

          test -f sismonauta_alertas.py || {
            echo "::error::Falta sismonauta_alertas.py"
            exit 1
          }

          python -m py_compile sismonauta_alertas.py

          echo "Script Python validado"

      # ========================================
      # 5. DETERMINAR MODO
      # ========================================

      - name: Determinar modo de ejecucion
        id: modo
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          EXTERNAL_PUBLISH: ${{ github.event.client_payload.publish }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in

            repository_dispatch)
              # Publicar por defecto.
              # Permite desactivar con:
              # "client_payload":{"publish":false}
              if [[ "$EXTERNAL_PUBLISH" == "false" ]]; then
                PUBLISH=false
              else
                PUBLISH=true
              fi
              ;;

            schedule)
              PUBLISH=true
              ;;

            workflow_dispatch)
              if [[ "$MANUAL_PUBLISH" == "true" ]]; then
                PUBLISH=true
              else
                PUBLISH=false
              fi
              ;;

            *)
              echo "::error::Evento no autorizado"
              exit 1
              ;;

          esac

          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

          echo "==================================="
          echo "SISMONAUTA ALERTAS M7+"
          echo "==================================="
          echo "Evento: $EVENT_NAME"
          echo "Publicar: $PUBLISH"
          echo "Umbral: magnitud >= 7.0"
          echo "Fuente sismica: USGS"
          echo "Fuente tsunami: PTWC/NTWC"
          echo "==================================="

      # ========================================
      # 6. VALIDAR CREDENCIALES
      # ========================================

      - name: Validar secretos
        if: ${{ steps.modo.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          for name in \
            INSTAGRAM_TOKEN \
            INSTAGRAM_USER_ID \
            FACEBOOK_PAGE_ID \
            FACEBOOK_PAGE_TOKEN \
            GH_TOKEN
          do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Falta credencial $name"
              exit 1
            fi
          done

          echo "Credenciales disponibles"

      # ========================================
      # 7. EJECUTAR MONITOREO
      # ========================================

      - name: Ejecutar monitoreo
        id: monitoreo
        shell: bash
        timeout-minutes: 16
        env:
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -uo pipefail

          args=(
            --out output_alertas
            --lookback-hours 24
          )

          if [[ "$PUBLISH" == "true" ]]; then
            args+=(--publish)
          fi

          python sismonauta_alertas.py "${args[@]}"
          CODE=$?

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Codigo del programa: $CODE"

          # El siguiente paso comprueba el recibo.
          exit 0

      # ========================================
      # 8. VERIFICAR RESULTADOS
      # ========================================

      - name: Verificar publicaciones
        if: ${{ steps.monitoreo.conclusion == 'success' }}
        shell: bash
        env:
          SCRIPT_EXIT: ${{ steps.monitoreo.outputs.exit_code }}
          PUBLISH: ${{ steps.modo.outputs.publish }}
        run: |
          set -euo pipefail

          python - <<'PYVERIFY'
          import json
          import os
          from pathlib import Path

          file = Path(
              "output_alertas/estado_publicacion.json"
          )

          code = int(os.getenv("SCRIPT_EXIT") or "1")
          publish = os.getenv("PUBLISH") == "true"

          print("Modo publicar:", publish)
          print("Codigo Python:", code)

          if code != 0:
              raise SystemExit(
                  "::error::Error en el script Python"
              )

          if not file.exists():
              raise SystemExit(
                  "::error::No existe recibo de monitoreo"
              )

          data = json.loads(
              file.read_text(encoding="utf-8")
          )

          status = data.get("status")
          print("Estado:", status)

          if status == "no_new_event":
              print(
                  "::notice::Sin nuevos eventos M7+ "
                  "pendientes de publicacion"
              )
              raise SystemExit(0)

          if status == "preview_only":
              if publish:
                  raise SystemExit(
                      "::error::Se esperaba publicacion"
                  )

              print("Vista previa generada")
              raise SystemExit(0)

          if status == "partial_or_uncertain":
              raise SystemExit(
                  "::error::Publicacion parcial o "
                  "incierta. Revisar las plataformas."
              )

          if status != "published":
              raise SystemExit(
                  "::error::Resultado inesperado: "
                  + str(status)
              )

          if not publish:
              raise SystemExit(
                  "::error::Publicacion no solicitada"
              )

          events = data.get("events", [])

          if not events:
              raise SystemExit(
                  "::error::No hay eventos confirmados"
              )

          for event in events:
              targets = event.get("targets", {})

              for platform in ("instagram", "facebook"):
                  info = targets.get(platform, {})

                  if (
                      info.get("status") != "published"
                      or not str(info.get("id") or "").strip()
                  ):
                      raise SystemExit(
                          "::error::Falta confirmacion: "
                          + platform
                      )

                  print(
                      "CONFIRMADO:",
                      event.get("id"),
                      platform,
                      info["id"]
                  )

          print(
              "SISMONAUTA: publicacion confirmada "
              "en Instagram y Facebook"
          )
          PYVERIFY

      # ========================================
      # 9. GUARDAR EVIDENCIAS
      # ========================================

      - name: Guardar imagenes y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sismonauta-m7-${{ github.run_id }}-${{ github.run_attempt }}
          path: output_alertas/
          if-no-files-found: warn
          retention-days: 14
